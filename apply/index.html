<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Building Permit Applications · City of Arab</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=Public+Sans:wght@700;800&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
<style>
/* Layout: public side = city portal (navy/gold) with app-style left nav; staff side = Jotform-style workspace + green table + right-hand submission panel. */
:root{
  --bg:#f3f4f8; --surface:#ffffff; --surface2:#f7f8fb; --line:#dfe2ea; --line2:#eceef3;
  --ink:#0a1551; --ink2:#343c6a; --muted:#6c73a8;
  --navy:#0a1551; --city:#0f3273; --gold:#f2c230; --orange:#ff6100; --green:#0d8a3f; --green2:#e7f5ec;
  --blue:#0075e3; --red:#d61f38; --redbg:#fde8eb; --amber:#a86400; --amberbg:#fff4dc; --okbg:#e2f6e9; --ok:#0b7a37;
  --rowhover:#f2f6ff; --sel:#e6eeff; --shadow:0 1px 2px rgba(10,21,81,.06),0 4px 16px rgba(10,21,81,.06);
  --f-body:"DM Sans",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-disp:"Public Sans","DM Sans",ui-sans-serif,system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e1230; --surface:#161b3d; --surface2:#1b2149; --line:#2c3466; --line2:#242b58;
  --ink:#eef0ff; --ink2:#c7cbef; --muted:#9097c9; --city:#7fa2ff; --green:#3ec276; --green2:#173a2a;
  --blue:#5aa8ff; --red:#ff6b80; --redbg:#3d1822; --amber:#ffc35a; --amberbg:#3a2c10; --okbg:#143524; --ok:#5fd98e;
  --rowhover:#1f2652; --sel:#26306a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1230; --surface:#161b3d; --surface2:#1b2149; --line:#2c3466; --line2:#242b58;
  --ink:#eef0ff; --ink2:#c7cbef; --muted:#9097c9; --city:#7fa2ff; --green:#3ec276; --green2:#173a2a;
  --blue:#5aa8ff; --red:#ff6b80; --redbg:#3d1822; --amber:#ffc35a; --amberbg:#3a2c10; --okbg:#143524; --ok:#5fd98e;
  --rowhover:#1f2652; --sel:#26306a; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0}
[hidden]{display:none!important}
img{max-width:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--f-body);-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
input,select,textarea{font-size:16px}
a{color:var(--blue)}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
h1,h2,h3{text-wrap:balance;margin:0}
.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:6px;padding:8px 14px;font-weight:600;font-size:14px;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--green);border-color:var(--green);color:#fff}
.btn.orange{background:var(--orange);border-color:var(--orange);color:#fff}
.btn.navy{background:var(--navy);border-color:var(--navy);color:#fff}
.btn.danger{color:var(--red);border-color:var(--red);background:transparent}
.btn.ghost{border-color:transparent;background:transparent}
.btn.sm{padding:5px 10px;font-size:13px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
svg.i{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* ---------- PUBLIC: app shell ---------- */
.app{display:grid;grid-template-columns:minmax(0,1fr);min-height:100%}
.side{background:var(--surface);border-right:1px solid var(--line);padding:14px 10px;display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 14px;font-weight:700;font-size:16px}
.brand .seal{width:34px;height:34px;border-radius:8px;background:var(--city);display:grid;place-items:center;color:var(--gold);font:800 9.5px var(--f-disp);letter-spacing:.02em}
.navi{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:7px;color:var(--ink2);text-decoration:none;font-weight:500;font-size:14px}
.navi.on{background:var(--sel);color:var(--ink);font-weight:600}
.navi.dim{opacity:.55}
.side .grow{flex:1}
.stage{background:var(--city);padding:24px 16px 48px;min-width:0}
.sheet{max-width:860px;margin:0 auto;background:var(--surface);border-radius:14px;padding:30px 28px;box-shadow:var(--shadow)}
.preview-note{max-width:860px;margin:0 auto 14px;color:#dfe6ff;font-size:13px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.preview-note b{color:var(--gold)}
.pg-h{font:800 30px/1.15 var(--f-disp);color:var(--ink);text-align:center}
.pg-sub{color:var(--muted);text-align:center;margin:6px auto 0;max-width:52ch}
.grp{margin-top:28px}
.grp h2{font:700 13px var(--f-body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:10px;display:flex;justify-content:space-between;gap:10px}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.tile{display:flex;gap:14px;align-items:flex-start;text-align:left;border:1px solid var(--line);border-radius:10px;padding:16px;background:var(--surface);cursor:pointer;width:100%}
.tile:hover{border-color:var(--city);box-shadow:var(--shadow)}
.tile .ico{width:42px;height:42px;border-radius:9px;background:var(--sel);color:var(--city);display:grid;place-items:center;flex:none}
.tile .ico svg{width:22px;height:22px}
.tile b{display:block;font-size:15.5px;line-height:1.3;color:var(--ink)}
.tile small{display:block;color:var(--muted);font-size:13px;margin-top:3px}
.tile .fee{display:inline-block;margin-top:8px;font-size:12.5px;font-weight:700;color:var(--ok);background:var(--okbg);border-radius:6px;padding:2px 9px}
.tile.paper .fee{color:var(--amber);background:var(--amberbg)}
details.sched{border:1px solid var(--line);border-radius:10px;margin-top:12px;background:var(--surface2)}
details.sched summary{cursor:pointer;padding:13px 16px;font-weight:600;list-style:none;display:flex;justify-content:space-between}
details.sched summary::after{content:"Show";color:var(--blue);font-weight:500;font-size:14px}
details.sched[open] summary::after{content:"Hide"}
.sched-body{padding:0 16px 16px;overflow-x:auto}
table.fees{border-collapse:collapse;width:100%;font-size:14px;min-width:420px}
table.fees th,table.fees td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line2)}
table.fees th{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.callout{border-radius:10px;padding:14px 16px;font-size:14px;margin-top:14px}
.callout.pay{background:var(--amberbg);color:var(--ink)}
.callout.warn{background:var(--redbg)}
.callout b{display:block;margin-bottom:2px}

/* ---------- PUBLIC: form ---------- */
.form-h{display:flex;flex-direction:column;gap:4px;border-bottom:1px solid var(--line);padding-bottom:16px;margin-bottom:18px}
.form-h h1{font:800 24px/1.2 var(--f-disp)}
.back{align-self:flex-start;background:none;border:0;color:var(--blue);cursor:pointer;padding:0;font-weight:600;font-size:14px;margin-bottom:6px}
.fgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 16px}
.fld{display:flex;flex-direction:column;gap:5px;min-width:0}
.fld.full{grid-column:1/-1}
.fld label.l{font-weight:600;font-size:14px;color:var(--ink)}
.fld .req{color:var(--red)}
.fld .hint{color:var(--muted);font-size:12.5px}
.fld input[type=text],.fld input[type=email],.fld input[type=tel],.fld input[type=date],.fld input[type=number],.fld select,.fld textarea{border:1px solid var(--line);border-radius:7px;padding:10px 12px;background:var(--surface);width:100%;min-width:0}
.fld textarea{min-height:90px;resize:vertical}
.fld input:focus,.fld select:focus,.fld textarea:focus{outline:2px solid var(--blue);outline-offset:0;border-color:transparent}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opt{display:flex;gap:8px;align-items:flex-start;border:1px solid var(--line);border-radius:8px;padding:9px 12px;cursor:pointer;font-size:14px;background:var(--surface)}
.opt:has(input:checked){border-color:var(--blue);background:var(--sel)}
.opts.stack{flex-direction:column}
.sect{grid-column:1/-1;font:700 13px var(--f-body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding-top:10px;border-top:1px solid var(--line2);margin-top:4px}
.drop{border:1.5px dashed var(--line);border-radius:10px;padding:18px;text-align:center;color:var(--muted);background:var(--surface2);cursor:pointer}
.drop.on{border-color:var(--blue);background:var(--sel)}
.filelist{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.fchip{display:flex;justify-content:space-between;align-items:center;gap:10px;border:1px solid var(--line);border-radius:7px;padding:6px 10px;font-size:13.5px;background:var(--surface)}
.fchip span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.feebox{grid-column:1/-1;border:1px solid var(--line);border-radius:10px;background:var(--surface2);padding:14px 16px;display:grid;gap:6px}
.feebox .r{display:flex;justify-content:space-between;gap:10px}
.feebox .r.t{border-top:1px solid var(--line);padding-top:8px;font-weight:700;font-size:17px}
.feebox small{color:var(--muted)}
.formerr{color:var(--red);font-weight:600;font-size:14px}
.submitrow{grid-column:1/-1;display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-top:6px}
.done{text-align:center;padding:24px 8px}
.done .ck{width:56px;height:56px;border-radius:50%;background:var(--okbg);color:var(--ok);display:grid;place-items:center;margin:0 auto 12px}

/* ---------- STAFF ---------- */
.jt-top{background:var(--navy);color:#fff;display:flex;align-items:center;gap:18px;padding:0 18px;height:60px;position:sticky;top:env(safe-area-inset-top,0px);z-index:20}
.jt-logo{display:flex;align-items:center;gap:9px;font:700 21px var(--f-body);letter-spacing:-.01em}
.jt-logo .mk{width:26px;height:26px;border-radius:6px;background:linear-gradient(135deg,#ff6100 0 50%,#ffb629 50% 100%)}
.jt-ws{color:#dfe3ff;font-weight:500;padding-left:16px;border-left:1px solid rgba(255,255,255,.18)}
.jt-top .sp{flex:1}
.jt-top .tl{color:#dfe3ff;background:none;border:0;cursor:pointer;font-weight:500;font-size:14px}
.avatar{width:36px;height:36px;border-radius:50%;background:var(--city);border:2px solid var(--orange);display:grid;place-items:center;font:800 10px var(--f-disp);color:var(--gold)}
.ws{display:grid;grid-template-columns:285px minmax(0,1fr);min-height:calc(100% - 60px)}
.ws-side{background:var(--surface);border-right:1px solid var(--line);padding:12px;display:flex;flex-direction:column;gap:10px}
.ws-side .create{background:var(--orange);color:#fff;border:0;border-radius:4px;padding:11px;font-weight:700;letter-spacing:.02em;cursor:pointer}
.meter{border-radius:6px;background:var(--okbg);padding:12px;font-size:13px}
.meter .bar{height:6px;border-radius:9px;background:var(--line);margin-top:8px;overflow:hidden}
.meter .bar i{display:block;height:100%;background:var(--ok);width:3%}
.ws-side h4{margin:8px 6px 0;font-size:14px;color:var(--ink2);font-weight:600}
.ws-side .navi.on{background:#c9d3f2;color:var(--navy)}
:root[data-theme="dark"] .ws-side .navi.on{background:var(--sel);color:var(--ink)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .ws-side .navi.on{background:var(--sel);color:var(--ink)}}
.ws-main{background:var(--surface);min-width:0}
.ws-bar{display:flex;justify-content:flex-end;gap:10px;padding:12px 18px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.search{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:4px;padding:0 10px;background:var(--surface);min-width:0}
.search input{border:0;outline:0;padding:9px 0;background:transparent;width:220px;max-width:100%}
.flist{list-style:none;margin:0;padding:10px 18px 40px}
.flist li{display:grid;grid-template-columns:22px 22px 44px minmax(0,1fr) auto;gap:14px;align-items:center;padding:14px 8px;border-radius:6px;cursor:pointer}
.flist li:hover{background:var(--rowhover)}
.ficon{width:40px;height:40px;border-radius:6px;background:#2c55c9;color:#fff;display:grid;place-items:center;position:relative}
.ficon.tbl{background:#14904a}
.ficon.app{background:var(--navy);border:1px solid var(--line)}
.ficon .badge{position:absolute;top:-7px;right:-8px;background:var(--red);color:#fff;font-size:10.5px;font-weight:700;border-radius:99px;min-width:19px;height:19px;display:grid;place-items:center;padding:0 5px;border:2px solid var(--surface)}
.flist b{font-size:17px;font-weight:500;color:var(--ink);display:block}
.flist small{color:var(--muted);font-size:13.5px;font-weight:500}
.cbx{width:17px;height:17px;border:1.5px solid #b8bdd6;border-radius:3px}
.star{color:#b5bbdb;background:none;border:0;cursor:pointer;padding:0;display:grid;place-items:center}
.star.on{color:#f5a700}
.star svg{width:18px;height:18px}
.star.on svg{fill:currentColor}

.tb-head{display:flex;align-items:center;gap:14px;padding:10px 18px;border-bottom:1px solid var(--line);background:var(--surface);flex-wrap:wrap}
.tb-head .ttl{flex:1;text-align:center;min-width:0}
.tb-head .ttl b{font-size:19px;font-weight:600;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tb-head .ttl small{color:var(--green);font-size:12.5px;font-weight:600}
.tabbar{background:var(--green);padding:8px 10px 0;display:flex;gap:8px;align-items:flex-end;overflow-x:auto}
.tabbar .tab{background:var(--surface);color:var(--ink);border-radius:6px 6px 0 0;padding:9px 14px;font-weight:700;font-size:13.5px;display:flex;gap:8px;align-items:center;white-space:nowrap}
.tabbar .newt{color:#fff;font-weight:600;font-size:13.5px;padding:9px 8px;opacity:.9;white-space:nowrap}
.tb-tools{display:flex;gap:10px;padding:12px;flex-wrap:wrap;align-items:center;border-bottom:1px solid var(--line)}
.tb-tools .search{flex:1;min-width:200px;max-width:420px}
.tb-tools .search input{width:100%}
.tb-tools .sp{flex:1}
select.mini{border:1px solid var(--line);border-radius:4px;padding:8px 10px;background:var(--surface);font-size:14px}
.colmenu{position:relative}
.colmenu .pop{position:absolute;right:0;top:calc(100% + 4px);background:var(--surface);border:1px solid var(--line);border-radius:8px;box-shadow:var(--shadow);padding:8px;z-index:15;width:230px;display:grid;gap:2px}
.colmenu .pop label{display:flex;gap:8px;padding:6px 8px;border-radius:5px;font-size:14px;cursor:pointer}
.colmenu .pop label:hover{background:var(--rowhover)}
.grid-wrap{overflow:auto;max-height:calc(100vh - 260px);min-height:240px}
table.grid{border-collapse:separate;border-spacing:0;width:max-content;min-width:100%;font-size:14px}
table.grid th{position:sticky;top:0;background:var(--surface2);z-index:2;text-align:left;font-weight:600;padding:0 12px;height:42px;border-bottom:1px solid var(--line);border-right:1px solid var(--line2);white-space:nowrap;cursor:pointer;user-select:none}
table.grid th .hd{display:flex;align-items:center;gap:7px}
table.grid th .ty{width:16px;height:16px;border-radius:3px;background:var(--ink2);color:var(--surface);font-size:10px;font-weight:700;display:grid;place-items:center}
table.grid td{padding:0 12px;height:41px;border-bottom:1px solid var(--line2);border-right:1px solid var(--line2);white-space:nowrap;max-width:260px;overflow:hidden;text-overflow:ellipsis;background:var(--surface)}
table.grid tr:hover td{background:var(--rowhover);cursor:pointer}
table.grid tr.sel td{background:var(--sel)}
table.grid tr.unread td{font-weight:700}
table.grid td.rn,table.grid th.rn{width:84px;color:var(--muted);position:sticky;left:0;z-index:1}
table.grid th.rn{z-index:3}
.rn-in{display:flex;align-items:center;gap:10px}
.pdfs{display:flex;gap:5px}
.pdfi{width:24px;height:28px;border-radius:3px;background:#7b2cbf;color:#fff;font-size:7px;font-weight:800;display:grid;place-items:end center;padding-bottom:2px}
.pdfi.img{background:#1b78d0}
.pill{display:inline-block;border-radius:99px;padding:2px 10px;font-size:12.5px;font-weight:700}
.pill.paid{background:var(--okbg);color:var(--ok)}
.pill.unpaid{background:var(--amberbg);color:var(--amber)}
.pill.new{background:var(--redbg);color:var(--red)}
.pill.src{background:var(--sel);color:var(--city);font-weight:600}
.grid-foot{display:flex;gap:18px;padding:10px 14px;font-size:13px;color:var(--muted);border-top:1px solid var(--line);flex-wrap:wrap}
.grid-foot b{color:var(--ink)}
.empty{padding:50px 20px;text-align:center;color:var(--muted)}

input.ck{width:17px;height:17px;margin:0;accent-color:var(--blue);cursor:pointer;flex:none}
.flist li.picked{background:var(--sel)}
.flist li.ws-head{display:flex;align-items:center;gap:12px;padding:6px 8px 10px;border-bottom:1px solid var(--line2);border-radius:0;flex-wrap:wrap;font-size:14px;color:var(--ink2);cursor:default}
.flist li.ws-head:hover{background:transparent}
.bulk{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:9px 12px;background:var(--sel);border-bottom:1px solid var(--line);font-size:14px}
.bulk b{margin-right:6px}
.dash{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;padding:12px 12px 4px}
.dtile{border:1px solid var(--line);border-radius:8px;padding:10px 12px;background:var(--surface);text-align:left;cursor:pointer;display:grid;gap:2px}
.dtile:hover{border-color:var(--blue)}
.dtile.on{border-color:var(--blue);box-shadow:inset 0 0 0 1px var(--blue)}
.dtile .lbl{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.dtile .big{font:800 24px/1.15 var(--f-disp);color:var(--ink)}
.dtile .sub{font-size:13px;color:var(--ink2)}
.dtile.unpaid .big{color:var(--amber)} .dtile.paid .big{color:var(--ok)}
.dash-period{display:flex;align-items:center;gap:8px;padding:10px 12px 0;font-size:14px;color:var(--ink2);flex-wrap:wrap}
.card{border:1px solid var(--line);border-radius:10px;background:var(--surface);padding:16px;display:grid;gap:12px}
.card h2{font:700 16px var(--f-body)}
.creds{background:var(--okbg);border-radius:8px;padding:12px;display:grid;gap:4px;font-size:14px}
.creds code{font-size:15px;user-select:all}
a.brandbar{display:flex;align-items:center;gap:12px;color:inherit;text-decoration:none;min-width:0}
.clogo{width:44px;height:44px;display:block;flex:none;object-fit:contain}
.bdiv{width:1px;align-self:stretch;margin:4px 0;background:currentColor;opacity:.35}
.bname{display:flex;flex-direction:column;font:700 17px/1.15 var(--f-disp);letter-spacing:.01em;min-width:0}
.bname small{font:500 12px/1.3 var(--f-body);letter-spacing:.04em;opacity:.8;text-transform:uppercase}
.jt-top a.brandbar{color:#fff}
.jt-top .clogo{width:40px;height:40px}
footer.sfoot{display:flex;justify-content:center;align-items:center;gap:10px;flex-wrap:wrap;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);color:var(--muted);font-size:13px;background:var(--surface)}
.linkbtn{background:none;border:0;padding:0;color:var(--blue);font-weight:600;cursor:pointer;font-size:13px}
.bugdlg{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(520px,calc(100% - 32px));max-height:calc(100% - 32px);overflow:auto;background:var(--surface);border-radius:12px;box-shadow:0 20px 60px rgba(6,10,40,.35);padding:20px;z-index:40;display:grid;gap:12px}
#bugbox .veil{z-index:39}
/* submission panel */
.veil{position:fixed;inset:0;background:rgba(6,10,40,.35);z-index:30}
.panel{position:fixed;top:0;right:0;bottom:0;width:min(640px,100%);background:var(--surface);z-index:31;display:flex;flex-direction:column;box-shadow:-10px 0 30px rgba(6,10,40,.2);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.p-head{display:flex;gap:10px;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.p-head .who{flex:1;min-width:0}
.p-head .who b{display:block;font-size:17px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.ck-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}

.ck-head p{margin:2px 0 0;color:var(--ink2)}
.ck-meta{margin:-6px 0 0;color:var(--ink2);font-size:14px}
.ck-two{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:14px}
.ck-card{border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:16px 18px;display:grid;gap:10px;align-content:start}
.ck-card h2{font:700 15px var(--f-body);margin:0;color:var(--ink)}
.ck-dl{margin:0;display:grid;gap:6px}
.ck-dl div{display:grid;grid-template-columns:150px 1fr;gap:10px;font-size:14.5px}
.ck-dl dt{color:var(--muted)}
.ck-dl dd{margin:0;color:var(--ink);overflow-wrap:anywhere}
.ck-fees div{grid-template-columns:1fr auto}
.ck-fees dd{text-align:right}
.ck-fees .t{border-top:1px solid var(--line);padding-top:6px;font-weight:700}
.ck-fees .due{font-size:18px;font-weight:800}
.ck-fees .due dt{color:var(--ink)}
.ck-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 16px}
.ck-grid .full{grid-column:1/-1}
.ck-money{display:flex;align-items:center;border:1px solid var(--line);border-radius:7px;background:var(--surface);padding-left:12px}
.ck-money span{color:var(--muted);font-weight:700}
.ck-money input{border:0!important;outline:0;flex:1;min-width:0;font-size:20px!important;font-weight:700;padding:9px 10px!important;background:transparent}
.ck-methods{display:flex;gap:8px;flex-wrap:wrap}
.ck-methods .opt{padding:10px 16px;font-weight:600}
.ck-methods .opt.on{border-color:var(--city);background:var(--sel);color:var(--city)}
.ck-confirm{border-color:var(--city);box-shadow:0 0 0 3px var(--sel)}
.ck-confirm p{margin:0;color:var(--ink2)}
.ck-big{font-size:18px}
.ck-big b{font-size:30px;color:var(--ink)}
.ck-paid{border-color:var(--ok);background:var(--okbg);grid-template-columns:auto 1fr;align-items:center;gap:12px}
.ck-paid b{color:var(--ok);font-size:16px}
.ck-ok{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;border-radius:12px;padding:14px 16px;background:var(--okbg);color:var(--ink);border:1px solid var(--ok)}
.ck-ok > div{display:grid;gap:2px}
.ck-ok b{color:var(--ok);font-size:16px}
.ck-hist{display:grid;gap:8px}
.ck-h{border:1px solid var(--line2);border-radius:10px;padding:10px 12px;display:grid;gap:4px}
.ck-h.rev .ck-h1{color:var(--muted);text-decoration:line-through}
.ck-h.isrev{background:var(--redbg)}
.ck-h1{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:baseline}
.ck-h2{font-size:13px;color:var(--muted)}
.ck-rev{display:grid;gap:6px}
.ck-rev input{border:1px solid var(--line);border-radius:7px;padding:9px 10px;background:var(--surface)}
.ck-tot{display:flex;gap:10px;flex-wrap:wrap}
.ck-tot div{border:1px solid var(--line);border-radius:10px;padding:10px 14px;background:var(--surface);display:grid;gap:2px;min-width:120px}
.ck-tot span{font-size:12.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:700}
.ck-tot b{font-size:18px}
.ck-tot .t{border-color:var(--city)}
tr.rev td{color:var(--muted)}
@media (max-width:760px){
  .roles{grid-template-columns:1fr}
  .ck-wrap{padding:16px 14px 32px}
  .ck-two,.ck-grid{grid-template-columns:1fr}
  .ck-dl div{grid-template-columns:120px 1fr}
  .ck-sbox .btn{display:none}
  .ck-row{flex-wrap:wrap}
  .ck-row .ico{display:none}
  .ck-amt{justify-items:start;grid-auto-flow:column;align-items:center;gap:8px}
  .ck-ok .btn,.ck-card .row .btn{width:100%;justify-content:center}
  .wsw{margin-left:8px}
  .wsw button{padding:5px 9px;font-size:12px}
}

@media (max-width:640px){
  .jt-top{gap:10px;padding:0 12px}
  .jt-top .bdiv{display:none}
  .jt-top .bname{font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .jt-top .bname small{font-size:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .jt-top .tl{white-space:nowrap}
  .jt-top .clogo{width:34px;height:34px}
}

/* v2.9: check scans + printed receipts */
.scandlg{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(620px,calc(100% - 24px));max-height:calc(100% - 24px);overflow:auto;background:var(--surface);border-radius:12px;box-shadow:0 20px 60px rgba(6,10,40,.35);padding:18px;z-index:50;display:grid;gap:12px}
.scandlg.wide{width:min(900px,calc(100% - 24px))}
#scanbox .veil,#scanview .veil{z-index:49}
.scan-choices{display:flex;gap:10px;flex-wrap:wrap}
.scan-choices .btn{cursor:pointer}
.scan-big{width:100%;max-height:62vh;object-fit:contain;background:#f1f3f8;border:1px solid var(--line);border-radius:8px}
.scan-mini{height:72px;max-width:180px;object-fit:contain;border:1px solid var(--line);border-radius:6px;background:#fff}
.scan-row{display:flex;gap:10px;flex-wrap:wrap;margin-top:8px}
.scan-th{display:flex;gap:10px;align-items:center;text-align:left;border:1px solid var(--line);border-radius:8px;background:var(--surface);padding:6px 10px 6px 6px;cursor:pointer;font:inherit;color:inherit;max-width:100%}
.scan-th:hover{border-color:var(--city)}
.scan-th img{height:58px;width:auto;max-width:140px;object-fit:contain;border-radius:4px;background:#fff;border:1px solid var(--line2)}
.scan-th .ph{display:grid;place-items:center;width:120px;height:58px;font-size:12px;color:var(--muted);background:var(--surface2);border-radius:4px}
.scan-th .cap{font-size:12.5px;color:var(--ink2);line-height:1.35}

.phone-block{display:grid;gap:12px;padding-top:28px;padding-bottom:40px}

/* v2.10: terms & agreements */
.agrees{display:grid;gap:10px}
.agree{display:flex;gap:10px;align-items:flex-start;font-size:15px;line-height:1.4;cursor:pointer}
.agree input{width:20px;height:20px;margin-top:1px;flex:none;accent-color:var(--city)}
.agl{font-size:15px;text-decoration:underline;text-align:left}
#agbox .veil{z-index:49}
.agdlg{width:min(680px,calc(100% - 24px))}
.agtext{max-height:58vh;overflow:auto;display:grid;gap:10px;font-size:15px;line-height:1.55;color:var(--ink);padding-right:4px}
.agtext p{margin:0}.agtext p.li{padding-left:14px}
.agtext h3{margin:6px 0 0;font:700 15px var(--f-body)}
</style>

const ic = (n, cls) => '<svg class="i '+(cls||'')+'" viewBox="0 0 24 24" aria-hidden="true">'+IC[n]+'</svg>';
const esc = s => String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money = n => '$' + (Number(n)||0).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
const num = v => { const n = parseFloat(String(v==null?'':v).replace(/[$,\s]/g,'')); return isFinite(n) ? n : 0; };

/* ================= fee schedule (copied from the live Jotform calculation rules) ================= */
function permitFeeFor(value){
  const v = num(value);
  if (v < 1) return 0;
  if (v <= 2500) return 25;
  if (v <= 50000)  return 25   + Math.ceil((v - 2500)   / 1000) * 5;
  if (v <= 100000) return 260  + Math.ceil((v - 50000)  / 1000) * 4;
  if (v <= 500000) return 460  + Math.ceil((v - 100000) / 1000) * 3;
  return 1660 + Math.ceil((v - 500000) / 1000) * 2;
}
const cictFor = (value, commercial) => commercial ? Math.round(num(value) / 1000 * 100) / 100 : 0;
const SIGN_FEE = { 'Illuminated':75, 'Electronic Message Display (Changing Message)':75, 'Non-illuminated':50 };

/* compute fees for any submission's field values; `doubled` = staff-applied penalty */
function computeFees(form, f, doubled){
  let value = 0, permit = 0, cict = 0, basis = '';
  if (isBldg(form)){
    const com = f.buildType === 'Commercial';
    if (com){ value = num(f.comValue); basis = 'Commercial construction value'; }
    else if (f.projectType === 'New Build' || f.projectType === 'Addition'){
      value = num(f.heated) * 75 + num(f.unheated) * 50;
      basis = num(f.heated).toLocaleString()+' heated sq ft × $75 + '+num(f.unheated).toLocaleString()+' unheated sq ft × $50';
    } else { value = num(f.estCost); basis = 'Estimated cost'; }
    permit = permitFeeFor(value); cict = cictFor(value, com);
  } else if (form === 'subtrade'){
    value = num(f.estCost); basis = 'Estimated project cost';
    permit = permitFeeFor(value); cict = cictFor(value, f.buildType === 'Commercial');
  } else if (form === 'sign'){ permit = SIGN_FEE[f.signFeature] || 0; basis = f.signFeature || 'Choose sign features'; }
  else if (form === 'pool'){ permit = 50; basis = 'Flat fee'; }
  else if (form === 'demo' || form === 'moving'){ permit = 100; basis = 'Flat fee'; }
  if (doubled) permit *= 2;
  permit = Math.round(permit*100)/100;
  return { value, basis, permit, cict, total: Math.round((permit + cict)*100)/100, doubled: !!doubled };
}

/* ================= behind-the-scenes document compression =================
   Applicants can pick files up to MAX_UPLOAD_MB. Each file is optimized in the
   browser as soon as it is added (photos resized + re-saved as JPG; large PDFs
   re-saved, and scanned/large PDFs re-drawn at print quality), so only the small
   version is stored. The original name, type and size are kept with the record. */
const MAX_UPLOAD_MB = 30;
const STORE_MAX = MAX_FILE_MB*1048576;
const PDFJS_CDN = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/';
let pdfjsP = null;
function loadPdfJs(){
  if (window.pdfjsLib) return Promise.resolve(window.pdfjsLib);
  return pdfjsP = pdfjsP || new Promise((ok, no) => { const s = document.createElement('script'); s.src = PDFJS_CDN+'pdf.min.js';
    s.onload = () => { if (!window.pdfjsLib){ pdfjsP = null; return no(new Error('PDF tool did not load')); } pdfjsLib.GlobalWorkerOptions.workerSrc = PDFJS_CDN+'pdf.worker.min.js'; ok(pdfjsLib); };
    s.onerror = () => { pdfjsP = null; no(new Error('PDF tool did not load')); }; document.head.appendChild(s); });
}
const canvasJpeg = (c, q) => new Promise((ok, no) => c.toBlob(b => b ? ok(b) : no(new Error('Could not compress')), 'image/jpeg', q));
const jpgName = n => String(n||'photo').replace(/\.[^./]+$/,'')+'.jpg';
async function shrinkImage(f){
  const keepable = /^image\/(jpeg|png)$/.test(f.type) && f.size <= STORE_MAX;
  if (keepable && f.size <= 400*1024) return null;                       // already small
  let bmp;
  try{ bmp = await createImageBitmap(f, {imageOrientation:'from-image'}); }
  catch(e){ try{ bmp = await createImageBitmap(f); }catch(e2){ if (keepable) return null; throw new Error(f.name+' could not be opened. Save it as a JPG, PNG or PDF and try again.'); } }
  try{
    for (const [px, q] of [[2400,.75],[1800,.65],[1400,.55]]){
      const sc = Math.min(1, px/Math.max(bmp.width, bmp.height)), c = document.createElement('canvas');
      c.width = Math.max(1, Math.round(bmp.width*sc)); c.height = Math.max(1, Math.round(bmp.height*sc));
      const g = c.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, c.width, c.height); g.drawImage(bmp, 0, 0, c.width, c.height);
      const b = await canvasJpeg(c, q); c.width = c.height = 0;
      if (keepable && b.size >= f.size) return null;                      // compressing would not help
      if (b.size <= STORE_MAX) return { blob:b, type:'image/jpeg', name:jpgName(f.name) };
    }
  } finally { if (bmp.close) bmp.close(); }
  return null;
}
async function rasterPdf(buf, target){
  const lib = await loadPdfJs();
  const doc = await lib.getDocument({ data: buf.slice(), isEvalSupported:false }).promise;
  try{
    let last = null;
    for (const [dpi, q] of [[150,.7],[110,.6],[80,.5]]){
      const out = await PDFLib.PDFDocument.create();
      for (let i = 1; i <= doc.numPages; i++){
        const pg = await doc.getPage(i), v1 = pg.getViewport({scale:1});
        const vp = pg.getViewport({ scale: Math.min(dpi/72, 3600/Math.max(v1.width, v1.height)) });
        const c = document.createElement('canvas'); c.width = Math.ceil(vp.width); c.height = Math.ceil(vp.height);
        const g = c.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, c.width, c.height);
        await pg.render({ canvasContext:g, viewport:vp }).promise;
        const jpg = await out.embedJpg(new Uint8Array(await (await canvasJpeg(c, q)).arrayBuffer()));
        out.addPage([v1.width, v1.height]).drawImage(jpg, { x:0, y:0, width:v1.width, height:v1.height });
        c.width = c.height = 0; pg.cleanup();
      }
      last = await out.save({ useObjectStreams:true });
      if (last.length <= target) break;
    }
    return new Blob([last], {type:'application/pdf'});
  } finally { doc.destroy(); }
}
async function shrinkPdf(f){
  if (f.size <= 1.5*1048576) return null;                                 // small PDFs are stored as they are
  const buf = new Uint8Array(await f.arrayBuffer());
  let best = f;
  try{ if (window.PDFLib){ const d = await PDFLib.PDFDocument.load(buf, {ignoreEncryption:true, updateMetadata:false});
    const out = await d.save({ useObjectStreams:true }); if (out.length < best.size) best = new Blob([out], {type:'application/pdf'}); } }catch(e){}
  if (best.size > 3*1048576 && window.PDFLib){
    // Re-draw each page at print quality (150 dpi). Used only when it saves at least 30%, or when needed to fit.
    // Give up after 2 minutes (e.g. the phone put the page to sleep) and keep the re-saved copy.
    try{ const r = await Promise.race([ rasterPdf(buf, Math.min(best.size*0.7, STORE_MAX)), new Promise((_, no) => setTimeout(() => no(new Error('timeout')), 120000)) ]);
      if (r.size < best.size*0.7 || (best.size > STORE_MAX && r.size < best.size)) best = r; }catch(e){}
  }
  return best === f ? null : { blob:best, type:'application/pdf', name:f.name };
}

  const isPdf = f.type === 'application/pdf' || /\.pdf$/i.test(f.name);

  try{ r = isPdf ? await shrinkPdf(f) : await shrinkImage(f); }
  catch(e){ if (!(f.size <= STORE_MAX && /^(application\/pdf|image\/(jpeg|png))$/.test(f.type))) throw e; }

let FILES = [];        // File objects queued for upload
let FVALS = {};

function fieldHtml(x, f){
  if (x.type==='section') return '<div class="sect">'+esc(x.label)+'</div>';
  if (x.type==='note') return '<div class="fld full hint" style="color:var(--ink2);font-size:14px">'+esc(x.text)+'</div>';
  if (x.show && !x.show(f)) return '';
  const id='f_'+x.id, req = x.req ? ' required' : '', star = x.req ? ' <span class="req">*</span>' : '';
  const v = f[x.id]==null ? '' : f[x.id];
  let inner='';
  if (x.type==='radio') inner = '<div class="opts'+(x.stack?' stack':'')+'" role="radiogroup">'+x.opts.map((o,i)=>'<label class="opt"><input type="radio" name="'+id+'" id="'+id+'_'+i+'" value="'+esc(o)+'"'+(v===o?' checked':'')+req+' data-k="'+x.id+'"> <span>'+esc(o)+'</span></label>').join('')+'</div>';
  else if (x.type==='select') inner = '<select id="'+id+'" data-k="'+x.id+'"'+req+'><option value="">Please select</option>'+x.opts.map(o=>'<option'+(v===o?' selected':'')+'>'+esc(o)+'</option>').join('')+'</select>';
  else if (x.type==='textarea') inner = '<textarea id="'+id+'" data-k="'+x.id+'"'+req+'>'+esc(v)+'</textarea>';
  else if (x.type==='file') inner = '<div class="drop" id="drop" tabindex="0" role="button">'+ic('upload')+'<div><b style="color:var(--blue)">Browse files</b> or drag and drop here</div><input type="file" id="fileIn" multiple accept="application/pdf,image/*,.heic,.heif" hidden></div><div class="filelist" id="flist"></div>';
  else { const t = x.type==='money'||x.type==='number' ? 'text" inputmode="decimal' : x.type;
    inner = '<input type="'+t+'" id="'+id+'" data-k="'+x.id+'" value="'+esc(v)+'"'+req+(x.type==='money'?' placeholder="$0.00"':'')+'>'; }
  return '<div class="fld'+(x.full?' full':'')+'"><label class="l" for="'+id+(x.type==='radio'?'_0':'')+'">'+esc(x.label)+star+'</label>'+inner+(x.hint?'<span class="hint">'+esc(x.hint)+'</span>':'')+'</div>';
}

function bindForm(){
  const form = document.getElementById('pf'); if (!form) return;
  form.oninput = form.onchange = e => {
    const k = e.target.dataset && e.target.dataset.k; if (!k) return;
    FVALS[k] = e.target.value;
    const F = FORMS[S.form];
    // re-render only when a conditional field's visibility changes
    const vis = visSig(F, FVALS);
    if (vis !== form.dataset.vis){ form.dataset.vis = vis; const a = document.activeElement && document.activeElement.id; form.innerHTML = formFieldsHtml(); bindFiles(); paintFiles(); if (a){ const el = document.getElementById(a); if (el) el.focus(); } }
    else document.getElementById('feebox').innerHTML = feeBoxHtml(S.form);
  };
  form.dataset.vis = visSig(FORMS[S.form], FVALS);
  form.onsubmit = submitForm; bindFiles(); paintFiles();
}
function bindFiles(){
  const d = document.getElementById('drop'), inp = document.getElementById('fileIn'); if (!d) return;
  d.onclick = () => inp.click(); d.onkeydown = e => { if (e.key==='Enter'||e.key===' '){ e.preventDefault(); inp.click(); } };
  inp.onchange = () => { addFiles(inp.files); inp.value=''; };
  d.ondragover = e => { e.preventDefault(); d.classList.add('on'); };
  d.ondragleave = () => d.classList.remove('on');
  d.ondrop = e => { e.preventDefault(); d.classList.remove('on'); addFiles(e.dataTransfer.files); };
}
function addFiles(list){
  const err = document.getElementById('ferr'); err.textContent='';
  for (const f of list){
    if (FILES.length >= 10){ err.textContent = 'You can attach up to 10 files.'; break; }
    if (!(f.type==='application/pdf' || /^image\//.test(f.type) || /\.(pdf|jpe?g|png|heic|heif)$/i.test(f.name))){ err.textContent = f.name+' is not a PDF or a photo. Save it as a PDF, JPG or PNG and try again.'; continue; }
    if (f.size > MAX_UPLOAD_MB*1048576){ err.textContent = f.name+' is larger than '+MAX_UPLOAD_MB+' MB. Split the PDF into smaller files or take a smaller photo.'; continue; }
    FILES.push(f); queueOptimize(f);
  }
  paintFiles();
}
function paintFiles(){
  const l = document.getElementById('flist'); if (!l) return;
  l.innerHTML = FILES.map((f,i)=>'<div class="fchip"><span>'+esc(f.name)+' · '+(f.size/1048576).toFixed(1)+' MB</span><button type="button" class="btn ghost sm" aria-label="Remove '+esc(f.name)+'" onclick="FILES.splice('+i+',1);paintFiles()">'+ic('x')+'</button></div>').join('');
}
async function submitForm(e){
  e.preventDefault();
  const form = e.target, err = document.getElementById('ferr'), btn = document.getElementById('subBtn');
  const agMissing = formAgreements(FORMS[S.form], FVALS).filter(a => FVALS['ag_'+a.id]!=='1');
  const otherBad = [...form.querySelectorAll(':invalid')].filter(el => !/^ag_/.test(el.id));
  if (otherBad.length){ form.reportValidity(); err.textContent = 'Please complete the required fields.'; return; }
  if (FORMS[S.form].fields.some(x => x.type==='file' && (!x.show || x.show(FVALS))) && !FILES.length){ err.textContent = 'Please upload at least one document. This application requires documents.'; const d = document.getElementById('drop'); if (d){ d.scrollIntoView({block:'center'}); d.focus(); } return; }
  if (agMissing.length){ err.textContent = 'Please read and agree to: '+agMissing.map(a=>AGREEMENTS[a.id].title).join(', ')+'.'; const c = document.getElementById('ag_'+agMissing[0].id); if (c){ c.scrollIntoView({block:'center'}); c.focus(); } return; }
  if (S.pubFull){ err.textContent = 'Online storage is full, so applications cannot be submitted right now. Please contact the Building Department.'; return; }
  btn.disabled = true; err.textContent='';
  const F = FORMS[S.form], vals = {};
  valueFields(F).forEach(x => { if ((!x.show || x.show(FVALS)) && FVALS[x.id]!=null && FVALS[x.id]!=='') vals[x.id] = String(FVALS[x.id]); });
  let opt;
  try{ btn.textContent = 'Preparing documents…'; opt = await Promise.all(FILES.map(f => OPT.get(f) || queueOptimize(f))); }
  catch(x){ err.textContent = x.message; btn.disabled=false; btn.textContent='Submit application'; return; }
  const files = opt.map(o => ({ name:o.name, type:o.type, size:o.size, origName:o.origName, origType:o.origType, origSize:o.origSize, compressed:o.compressed }));
  try{
    btn.textContent = 'Submitting…';
    const fees = computeFees(S.form, vals, false);
    const createdAt = new Date().toISOString();
    const agreements = formAgreements(F, FVALS).map(a => ({ id:a.id, title:AGREEMENTS[a.id].title, at:createdAt }));
    const subId = await sbRpc('bf_add', { p_token:null, p_collection:'submissions', p_data:{ app:APP_TAG, form:S.form, createdAt, read:false, starred:false, fields:vals, fees, files, agreements, staff:{ permitNo:'', payment:'' } } });
    for (let i=0;i<opt.length;i++){
      btn.textContent = 'Uploading document '+(i+1)+' of '+opt.length+'…';
      const data = await readDataUrl(opt[i].blob);
      await sbRpc('bf_add', { p_token:null, p_collection:'attachments', p_data:Object.assign({ app:APP_TAG, submissionId:subId, index:i, data }, files[i]) });
    }
    LAST_RECEIPT = { id:subId, form:S.form, createdAt, fields:vals, fees, agreements, files };
    const done = document.getElementById('sheet');
    done.innerHTML = '<div class="done"><div class="ck">'+ic('check')+'</div><h1 class="pg-h" style="font-size:24px">Application submitted</h1><p class="pg-sub">The Building Department has your '+esc(F.short)+' application'+(files.length?' and '+files.length+' document'+(files.length>1?'s':''):'')+'. You will be contacted at '+esc(vals.email||'the email you gave')+'.</p>'+
      '<div class="feebox" style="max-width:420px;margin:18px auto;text-align:left"><div class="r"><span>Reference #</span><b class="num" style="font-size:18px;letter-spacing:.04em">'+refNo(subId)+'</b></div><div class="r t"><span>Amount due</span><span class="num">'+money(fees.total)+'</span></div><small>Download your receipt and show it (printed or on your phone) when you pay in person at 740 N Main St, Arab, by cash or check made payable to “City of Arab.”</small></div>'+
      '<div class="row" style="justify-content:center;display:flex;gap:10px;flex-wrap:wrap"><button class="btn primary" onclick="downloadReceipt()">'+ic('down')+'Download receipt (PDF)</button><a class="btn" href="'+APPS_URL+'" target="_top">Back to Applications &amp; Fees</a></div></div>';
    FILES = []; FVALS = {};
  }catch(x){ err.textContent = 'Could not submit: '+((x&&x.message)||'please try again.'); btn.disabled=false; btn.textContent='Submit application'; }
}

/* workspace sorting + custom order (remembered in this browser) */
const WS_SORTS = [['az','Title [a-z]'],['za','Title [z-a]'],['most','Most submissions'],['unpaid','Most unpaid'],['unread','Most unread'],['recent','Latest submission'],['custom','My order (drag to arrange)']];
function wsLoad(){ try{ S.wsSort = localStorage.getItem('bdWsSort') || 'az'; S.wsOrder = JSON.parse(localStorage.getItem('bdWsOrder')||'null'); }catch(e){ S.wsSort = S.wsSort || 'az'; } }
function wsSave(){ try{ localStorage.setItem('bdWsSort', S.wsSort); if (S.wsOrder) localStorage.setItem('bdWsOrder', JSON.stringify(S.wsOrder)); }catch(e){} }
function wsOrderList(){ const o = (S.wsOrder||[]).filter(k=>FORM_ORDER.includes(k)); FORM_ORDER.forEach(k=>{ if (!o.includes(k)) o.push(k); }); return o; }
function wsSorted(keys){
  if (!S.wsSort) wsLoad();
  const t = k => FORMS[k].title, n = k => subsFor(k), last = k => (n(k)[0]||{}).createdAt || '';
  const by = { az:(a,b)=>t(a).localeCompare(t(b)), za:(a,b)=>t(b).localeCompare(t(a)), most:(a,b)=>n(b).length-n(a).length||t(a).localeCompare(t(b)),
    unpaid:(a,b)=>n(b).filter(s=>!isPaid(s)).length-n(a).filter(s=>!isPaid(s)).length||t(a).localeCompare(t(b)),
    unread:(a,b)=>n(b).filter(s=>!s.read).length-n(a).filter(s=>!s.read).length||t(a).localeCompare(t(b)),
    recent:(a,b)=>last(b).localeCompare(last(a))||t(a).localeCompare(t(b)) };
  if (S.wsSort==='custom'){ const o = wsOrderList(); return keys.slice().sort((a,b)=>o.indexOf(a)-o.indexOf(b)); }
  return keys.slice().sort(by[S.wsSort]||by.az);
}
function setWsSort(v){ if (v==='custom' && !S.wsOrder) S.wsOrder = wsSorted(FORM_ORDER.slice()); S.wsSort = v; wsSave(); render(); }
function wsMove(k, d){ const o = wsOrderList(), i = o.indexOf(k), j = i+d; if (j<0||j>=o.length) return; o.splice(i,1); o.splice(j,0,k); S.wsOrder = o; S.wsSort = 'custom'; wsSave(); render(); }
function wsDrag(e, k){ e.dataTransfer.setData('text/plain', k); e.dataTransfer.effectAllowed = 'move'; }
function wsDrop(e, k){ e.preventDefault(); const from = e.dataTransfer.getData('text/plain'); if (!from || from===k) return; const o = wsOrderList(); o.splice(o.indexOf(from),1); o.splice(o.indexOf(k),0,from); S.wsOrder = o; S.wsSort = 'custom'; wsSave(); render(); }

/* ================= STAFF: table ================= */
function filteredRows(){
  const k = S.form, cols = colsFor(k), q = S.q.trim().toLowerCase();
  let rows = inPeriod(subsFor(k));
  if (S.filter==='unread') rows = rows.filter(s=>!s.read);
  if (S.filter==='starred') rows = rows.filter(s=>s.starred);
  if (S.filter==='unpaid') rows = rows.filter(s=>!isPaid(s));
  if (S.filter==='paid') rows = rows.filter(isPaid);
  if (S.filter==='partial') rows = rows.filter(s=>payStatus(s)==='partial');
  if (q) rows = rows.filter(s => (JSON.stringify(s.fields)+' '+((s.staff&&s.staff.permitNo)||'')+' '+refNo(s.id)).toLowerCase().includes(q));
  const c = cols.find(c=>c.k===S.sort.k) || cols[0];
  return rows.slice().sort((a,b)=>{ const x=c.get(a), y=c.get(b); return (x<y?-1:x>y?1:0)*S.sort.d; });
}

   '<div class="tabbar"><span class="tab">'+ic('grid')+esc(F.short)+'</span><span class="newt">'+subsFor(k).length+' total</span></div>'+
   dashHtml(k)+
   '<div class="tb-tools"><label class="search">'+ic('search')+'<input id="tq" placeholder="Search name, address, permit #, reference #…" value="'+esc(S.q)+'" aria-label="Search submissions"></label>'+

const curSub = () => S.subs.find(x=>x.id===S.sel);
async function saveEdit(){
  const s = curSub(); if (!s||!DB) return;
  const f = Object.assign({}, s.fields);
  document.querySelectorAll('#editf [data-k]').forEach(el=>{ if (el.value==='') delete f[el.dataset.k]; else f[el.dataset.k]=el.value; });
  const fees = s.imported ? s.fees : computeFees(s.form, f, s.fees&&s.fees.doubled);
  const body = JSON.parse(JSON.stringify(s)); delete body.id;
  Object.assign(body, { fields:f, fees, editedAt:new Date().toISOString() });
  try{ await DB.doc('submissions/'+s.id).set(body);
    S.editing=false; toast('Changes saved'); render(); }catch(e){ toast('Could not save: '+(e.message||'try again')); }
}
async function saveOffice(){
  const s = curSub(); if (!s||!DB) return;
  const g = id => { const el = document.getElementById(id); return el ? el.value : undefined; };
  const st = { permitNo:g('o_permitNo')||'', payment:(s.staff&&s.staff.payment)||'', checkNo:(s.staff&&s.staff.checkNo)||'', approvedBy:g('o_approvedBy')||'', approvedDate:g('o_approvedDate')||'', comments:g('o_comments')||'' };
  if (document.getElementById('i_Footing_d')){ st.inspections = {}; INSPECT.forEach(n=>{ st.inspections[n] = { date:g('i_'+n+'_d')||'', by:g('i_'+n+'_b')||'', recorded:g('i_'+n+'_r')||'' }; }); }
  if (document.getElementById('o_co')){ st.co=g('o_co')||''; st.coInit=g('o_coInit')||''; st.coComments=g('o_coComments')||''; }

function exportCsv(){

  const q = v => '"'+String(v==null?'':v).replace(/"/g,'""')+'"';
  const lines = [all.map(q).join(',')].concat(rows.map(s=>[...cols.filter(c=>c.k!=='files').map(c=>{ const v=c.get(s); return c.k==='createdAt'?fmtDate(v):c.k==='payment'?payText(s):v; }), (s.files||[]).map(f=>f.name).join('; ')].map(q).join(',')));

}

const pdfSafe = t => String(t==null?'':t).replace(/[‘’]/g,"'").replace(/[“”]/g,'"').replace(/[–—]/g,'-').replace(/[^\x0A\x20-\x7E\xA0-\xFF]/g,'?');
async function buildPdf(s){
  const { PDFDocument, StandardFonts, rgb } = PDFLib;
  const pdf = await PDFDocument.create();
  const reg = await pdf.embedFont(StandardFonts.Helvetica), bold = await pdf.embedFont(StandardFonts.HelveticaBold);
  const F = FORMS[s.form], st = s.staff||{}, W=612, H=792, M=46;
  const navy = rgb(0.06,0.2,0.45), grey = rgb(0.42,0.45,0.6), line = rgb(0.86,0.88,0.92);
  let page, y;
  const wrap = (t, font, size, width) => { const out=[]; pdfSafe(t).split('\n').forEach(par=>{ let cur=''; par.split(/\s+/).forEach(w=>{ const tryL = cur?cur+' '+w:w; if (font.widthOfTextAtSize(tryL,size) > width && cur){ out.push(cur); cur=w; } else cur=tryL; }); out.push(cur); }); return out; };
  const newPage = () => { page = pdf.addPage([W,H]);
    page.drawRectangle({x:0,y:H-70,width:W,height:70,color:navy});
    page.drawText('City of Arab Building Department', {x:M,y:H-32,size:15,font:bold,color:rgb(1,1,1)});
    page.drawText(pdfSafe(F.title), {x:M,y:H-52,size:10.5,font:reg,color:rgb(0.95,0.76,0.19)});
    page.drawText(pdfSafe('Permit # '+(st.permitNo||'not assigned')), {x:W-M-bold.widthOfTextAtSize('Permit # '+(st.permitNo||'not assigned'),10.5),y:H-32,size:10.5,font:bold,color:rgb(1,1,1)});
    y = H-96; };
  const head = t => { if (y<90) newPage(); y-=6; page.drawText(pdfSafe(t.toUpperCase()), {x:M,y,size:9,font:bold,color:grey}); y-=6; page.drawLine({start:{x:M,y},end:{x:W-M,y},thickness:.7,color:line}); y-=14; };
  const row = (l, v) => { const ll = wrap(l,bold,9.5,170), vl = wrap(v,reg,10,W-2*M-185); const h = Math.max(ll.length, vl.length)*13+5;
    if (y-h < 50) newPage();
    ll.forEach((t,i)=>page.drawText(t,{x:M,y:y-i*13,size:9.5,font:bold,color:rgb(0.2,0.24,0.42)}));
    vl.forEach((t,i)=>page.drawText(t,{x:M+185,y:y-i*13,size:10,font:reg,color:rgb(0.04,0.08,0.3)}));
    y -= h; };
  newPage();
  row('Submitted', fmtDT(s.createdAt)); row('Applicant', s.fields.applicant||''); row('Property address', s.fields.address||'');
  let sec = null;
  F.fields.forEach(x=>{ if (x.type==='section'){ sec = x.label; return; } if (!x.id||x.type==='file'||x.type==='note') return;
    const v = s.fields[x.id]; if (v==null||v==='') return; if (sec){ head(sec); sec=null; }
    row(x.label, x.type==='money'?money(num(v)):v); });
  if (Array.isArray(s.agreements) && s.agreements.length){ head('Terms & agreements'); s.agreements.forEach(a => row(a.title||a.id, 'Agreed '+fmtDT(a.at))); }
  const fe = s.fees||{}; head('Fees');
  if (isBldg(s.form)||s.form==='subtrade'){ row('Construction value', money(fe.value)+(fe.basis?'  ('+fe.basis+')':'')); }
  row('Permit fee', money(fe.permit)+(fe.doubled?'  (doubled - work started without permit)':''));
  if (isBldg(s.form)||s.form==='subtrade') row('CICT fee', money(fe.cict));
  row('Grand total', money(fe.total));
  head('Office use');
  row('Payment', payText(s)+(s.pay&&s.pay.lastReceipt?'  ·  receipt '+s.pay.lastReceipt:''));
  row('Approval', [st.approvedBy, st.approvedDate].filter(Boolean).join('  ·  ')||'-');
  if (st.inspections) INSPECT.forEach(n=>{ const r=st.inspections[n]||{}; if (r.date||r.by||r.recorded) row(n+' inspection', [r.date&&'Inspected '+r.date, r.by&&'by '+r.by, r.recorded&&'recorded '+r.recorded].filter(Boolean).join(', ')); });
  if (st.co) row('Certificate of Occupancy', st.co+(st.coInit?'  ·  '+st.coInit:'')+(st.coComments?'\n'+st.coComments:''));
  if (st.comments) row('Staff comments', st.comments);
  const fl = await loadAtt(s.id), ext = (s.files||[]).filter(f=>f.url);
  head('Documents attached ('+(fl.length+ext.length)+')');
  fl.forEach((f,i)=>row('Document '+(i+1), f.name+(f.compressed&&f.origSize?'\nOriginal size '+mb(f.origSize)+(f.origName&&f.origName!==f.name?' ('+f.origName+')':'')+' - compressed to '+mb(f.size)+' for storage':(f.size?'\n'+mb(f.size):''))));
  ext.forEach((f,i)=>row('Document '+(fl.length+i+1), f.name+'\nStored in Jotform: '+f.url));
  const formPages = pdf.getPageCount();
  // attachments
  for (const f of fl){
    try{
      const buf = dataUrlBytes(f.data);
      if (/pdf/.test(f.type)){ const src = await PDFDocument.load(buf,{ignoreEncryption:true}); const pgs = await pdf.copyPages(src, src.getPageIndices()); pgs.forEach(p=>pdf.addPage(p)); }
      else if (/image\/(png|jpe?g)/.test(f.type)){
        const img = /png/.test(f.type) ? await pdf.embedPng(buf) : await pdf.embedJpg(buf);
        const p = pdf.addPage([W,H]); p.drawText(pdfSafe(f.name+(sizeNote(f)?'  ·  '+sizeNote(f):'')),{x:M,y:H-34,size:9,font:reg,color:grey});
        const sc = Math.min((W-2*M)/img.width, (H-2*M-20)/img.height, 1); const w=img.width*sc, h=img.height*sc;
        p.drawImage(img,{x:(W-w)/2,y:(H-20-h)/2,width:w,height:h});
      } else throw 0;
    }catch(e){ const p = pdf.addPage([W,H]); p.drawText(pdfSafe('Could not include '+f.name+'. Open it from the Documents tab.'),{x:M,y:H-60,size:11,font:reg}); }
  }
  pdf.getPages().forEach((p,i)=>{ if (i<formPages) p.drawText(pdfSafe('Page '+(i+1)+' of '+formPages+'  ·  generated '+fmtDT(new Date().toISOString())),{x:M,y:24,size:8,font:reg,color:grey}); });
  return pdf.save();
}
async function downloadPdf(sid){
  const s = sid ? S.subs.find(x=>x.id===sid) : curSub(); if (!s) return; const b = document.getElementById('pdfBtn');
  if (!window.PDFLib){ toast('The PDF tool did not load. Check your connection and try again.'); return; }
  try{ if (b){ b.disabled=true; b.textContent='Building PDF…'; }
    const bytes = await buildPdf(s);
    const nm = ('Permit-'+((s.staff&&s.staff.permitNo)||fmtDate(s.createdAt))+'-'+(s.fields.applicant||'')).replace(/[^A-Za-z0-9]+/g,'-').replace(/-+$/,'')+'.pdf';
    await DL.save({ filename:nm, data:bytes });
  }catch(e){ toast('Could not build the PDF: '+((e&&e.message)||'try again')); }
  finally{ render(); }
}

  const D = PDF_FORMS[key], { PDFDocument, StandardFonts, rgb, PDFName, PDFString, PDFDict, PDFCheckBox } = PDFLib;
  const r = await fetch(D.src); if (!r.ok) throw new Error('The form could not be loaded ('+r.status+').');
  const pdf = await PDFDocument.load(await r.arrayBuffer(), { ignoreEncryption:true });
  const font = await pdf.embedFont(StandardFonts.Helvetica), form = pdf.getForm(), pages = pdf.getPages();
  const bg = rgb(0.91, 0.95, 1), border = rgb(0.45, 0.5, 0.65);
  D.fields.forEach(([p, k, x, y, w, h, name]) => {
    const page = pages[p]; if (!page) return;
    if (k === 1){ const cb = form.createCheckBox(name); cb.addToPage(page, { x, y, width:w, height:h, backgroundColor:bg, borderColor:border, borderWidth:0.6 }); }
    else { const tf = form.createTextField(name); if (k === 2) tf.enableMultiline();
      tf.addToPage(page, { x, y, width:w, height:h, font, backgroundColor:bg, borderWidth:0 }); tf.setFontSize(k === 2 ? 10 : (h < 12 ? 8 : 9)); }
  });
  form.updateFieldAppearances(font);
  // Checkboxes: give them what Acrobat and Mac Preview expect (check-mark font, an "Off" value
  // and a check caption), not only Chrome.
  const zadb = await pdf.embedFont(StandardFonts.ZapfDingbats);
  const af = form.acroForm.dict; let dr = af.lookup(PDFName.of('DR'));
  if (!(dr instanceof PDFDict)){ dr = pdf.context.obj({}); af.set(PDFName.of('DR'), dr); }
  let dfont = dr.lookup(PDFName.of('Font')); if (!(dfont instanceof PDFDict)){ dfont = pdf.context.obj({}); dr.set(PDFName.of('Font'), dfont); }
  dfont.set(PDFName.of('ZaDb'), zadb.ref);
  form.getFields().forEach(fl => { if (!(fl instanceof PDFCheckBox)) return;
    fl.acroField.dict.set(PDFName.of('DA'), PDFString.of('/ZaDb 0 Tf 0 g'));
    fl.acroField.dict.set(PDFName.of('V'), PDFName.of('Off'));
    fl.acroField.getWidgets().forEach(w => { w.getOrCreateAppearanceCharacteristics().setCaptions({ normal:'4' }); w.dict.set(PDFName.of('AS'), PDFName.of('Off')); });
  });
  pdf.setTitle(D.title+' - City of Arab');
  return PDF_CACHE[key] = await pdf.save();
}
async function pdfFormAction(key, how){
  const b = document.getElementById('pdfGo_'+how), err = document.getElementById('pdfErr');
  if (!window.PDFLib){ err.textContent = 'The PDF tool did not load. Check your connection and refresh the page.'; return; }
  const label = b ? b.innerHTML : ''; if (b){ b.disabled = true; b.textContent = 'Preparing the form…'; } err.textContent = '';
  try{
    const bytes = await buildFillable(key), blob = new Blob([bytes], {type:'application/pdf'});
    if (how === 'open'){ const u = URL.createObjectURL(blob), w = window.open(u, '_blank'); if (!w) await DL.save({ filename:PDF_FORMS[key].file, data:blob }); setTimeout(() => URL.revokeObjectURL(u), 600000); }
    else await DL.save({ filename:PDF_FORMS[key].file, data:blob });
  }catch(e){ err.textContent = 'Could not prepare the form: '+((e&&e.message)||'please try again.'); }

}

function ckReview(){
  const f = S.ck.f, bal = Number((S.ck.rec.pay||{}).balance)||0, amt = Number(String(f.amount).replace(/[$,\s]/g,''));
  S.ck.err = '';
  if (!(amt > 0)) S.ck.err = 'Enter the amount received.';
  else if (amt > bal + 0.004) S.ck.err = 'That is more than the balance due ('+money(bal)+').';
  else if (!f.method) S.ck.err = 'Choose how the payment was made.';
  else if (needsNo(f.method) && !String(f.checkNo).trim()) S.ck.err = 'Enter the '+f.method.toLowerCase()+' number.';
  else if (!f.on || f.on > todayISO()) S.ck.err = 'Enter the date the payment was received (not a future date).';
  if (S.ck.err){ render(); return; }
  f.amount = amt.toFixed(2); f.checkNo = String(f.checkNo).trim();
  if (!f.req) f.req = (crypto.randomUUID ? crypto.randomUUID() : 'xxxxxxxx-xxxx-4xxx-8xxx-xxxxxxxxxxxx'.replace(/x/g, () => (Math.random()*16|0).toString(16)));
  S.ck.step = 'confirm'; render();
}
async function ckRecord(allowDup){
  const C = S.ck, f = C.f, b = document.getElementById('ckGo'); if (b){ b.disabled = true; b.textContent = 'Recording…'; }
  try{
    const r = await sbRpc('bf_record_payment', { p_token:TOKEN, p_sid:C.sel, p_amount:Number(f.amount), p_method:f.method, p_check_no:needsNo(f.method)?f.checkNo:'',
      p_received_on:f.on, p_note:f.note||'', p_request_id:f.req, p_allow_duplicate:!!allowDup });
    C.rec = r.record; C.done = r.payment; C.step = 'form'; C.err = ''; C.f = ckFreshForm(r.record);
    syncSubPay(r.record); toast('Payment recorded');
    const scan = C.scan; C.scan = null; render(); window.scrollTo(0,0);
    if (scan && needsNo(r.payment.method)) await uploadScan(r.payment.id, scan);
    if (['Cash','Check','Money order'].includes(r.payment.method)) printPaperReceipt(r.payment.id);
    return;
  }catch(e){ C.err = e.message || 'Could not record the payment. Try again.'; if (!/^DUPLICATE/.test(C.err)) f.req = null; }
  render(); window.scrollTo(0,0);
}
async function ckReverse(id){
  const why = (document.getElementById('ckWhy')||{}).value || '';
  if (why.trim().length < 3){ toast('Explain why the payment is being reversed.'); return; }
  try{ const r = await sbRpc('bf_reverse_payment', {p_token:TOKEN, p_payment_id:id, p_reason:why});
    S.ck.rec = r.record; S.ck.done = r.payment; S.ck.revFor = null; S.ck.f = ckFreshForm(r.record); syncSubPay(r.record); toast('Payment reversed'); }
  catch(e){ toast('Could not reverse: '+e.message); }
  render(); window.scrollTo(0,0);
}

  if (/iPhone|iPod|Windows Phone|Android.+Mobile|Mobile.+Firefox/i.test(ua)) return true;

function printHtml(html){
  const old = document.getElementById('printFrame'); if (old) old.remove();
  const f = document.createElement('iframe'); f.id = 'printFrame'; f.title = 'Receipt to print'; f.setAttribute('aria-hidden', 'true');
  f.style.cssText = 'position:fixed;right:0;bottom:0;width:0;height:0;border:0';
  document.body.appendChild(f);
  const d = f.contentDocument; d.open(); d.write(html); d.close();
  const waits = [...d.images].map(i => i.complete ? null : new Promise(r => { i.onload = i.onerror = r; }));
  return Promise.race([Promise.all(waits), new Promise(r => setTimeout(r, 2500))]).then(() => {
    try{ f.contentWindow.focus(); f.contentWindow.print(); }catch(e){ toast('Could not open the print window: '+e.message); }
  });
}
function findPayment(pid){
  const r = S.ck && S.ck.rec, list = (r && r.payments) || [];
  let x = list.find(p => p.id === pid) || (S.ck && S.ck.done && S.ck.done.id === pid ? S.ck.done : null);
  if (!x) Object.keys(PH).some(k => Array.isArray(PH[k]) && (x = PH[k].find(p => p.id === pid)));
  return x || null;
}

async function loadScan(pid){ try{ SCANS[pid] = await sbRpc('bf_check_scan', {p_token:TOKEN, p_payment_id:pid}) || {err:'No scan on file.'}; }catch(e){ SCANS[pid] = {err:e.message}; } render(); }
const scanSrc = s => s && s.data ? 'data:'+(s.mime||'image/jpeg')+';base64,'+s.data : '';
function scanThumbHtml(x){
  if (!x || !x.scan) return '';

  if (s === undefined) setTimeout(() => { if (SCANS[x.id] === undefined){ SCANS[x.id] = null; loadScan(x.id); } }, 0);
  return '<button type="button" class="scan-th" onclick="viewScan('+x.id+')" aria-label="View the scanned check for receipt '+esc(x.receiptNo)+'">'+
    (s && s.data ? '<img src="'+scanSrc(s)+'" alt="">' : '<span class="ph">'+(s && s.err ? 'Scan unavailable' : 'Loading scan…')+'</span>')+
    '<span class="cap">'+esc(x.method)+(x.checkNo?' #'+esc(x.checkNo):'')+' · paid '+esc(fmtDay(x.receivedOn || x.recordedAt))+'<br>Marked paid by '+esc(x.recordedBy||'')+'</span></button>';
}

      '<div><dt>Marked paid by</dt><dd>'+esc(x.recordedBy||'')+' · '+esc(fmtDT(x.recordedAt))+'</dd></div>'+

function scanBlob(pid){ const s = SCANS[pid]; const bin = atob(s.data), u = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i); return new Blob([u], {type: s.mime||'image/jpeg'}); }

/* ---- scanner: camera or a file from the scanner; auto crop, straighten and fit ---- */
const SC = { stream:null, src:null, out:null, rot:0, auto:true, target:null, busy:false, found:true };
function openScanner(target){
  closeScanner(); SC.target = target; SC.src = SC.out = null; SC.rot = 0; SC.auto = true;
  const box = document.createElement('div'); box.id = 'scanbox';
  box.innerHTML = '<div class="veil"></div><div class="scandlg" role="dialog" aria-modal="true" aria-labelledby="scT"><h2 id="scT" style="margin:0;font:700 17px var(--f-body)">Scan the '+(target.label||'check')+'</h2><div id="scBody"></div></div>';
  document.body.appendChild(box); document.addEventListener('keydown', scannerKey); scanStep('choose');
}
function scannerKey(e){ if (e.key === 'Escape') closeScanner(); }

function scanStep(step, msg){
  const el = document.getElementById('scBody'); if (!el) return;

  if (step === 'choose'){
    el.innerHTML = (msg ? '<p class="formerr" role="alert">'+esc(msg)+'</p>' : '')+
      '<p style="margin:0;color:var(--ink2)">Lay the check face up. The portal finds the check, straightens it, trims the background and shrinks it before saving.</p>'+
      '<div class="scan-choices"><button type="button" class="btn primary" onclick="scanCamera()">'+ic('upload')+'Use camera</button>'+
      '<label class="btn"><input id="scFile" type="file" accept="image/*,application/pdf" style="position:absolute;left:-9999px" onchange="scanFile(this.files[0])">'+ic('doc')+'Choose a scanned file</label></div>'+
      '<p class="hint" style="margin:0">Desk scanner: scan the check to a file (JPG, PNG or PDF) with the scanner\'s own app, then choose that file. Webcam or phone: hold the check flat on a dark, plain surface.</p>'+
      '<div class="row" style="justify-content:flex-end"><button type="button" class="btn ghost" onclick="closeScanner()">Cancel</button></div>';
    el.querySelector('button').focus();

    el.innerHTML = '<video id="scVid" autoplay playsinline muted style="width:100%;border-radius:8px;background:#000;max-height:60vh"></video>'+
      '<div class="row" style="gap:8px;justify-content:space-between"><button type="button" class="btn ghost" onclick="scanStep(\'choose\')">Back</button><button type="button" class="btn primary" id="scSnap" onclick="scanSnap()">Take picture</button></div>';
    const v = document.getElementById('scVid'); v.srcObject = SC.stream; document.getElementById('scSnap').focus();
  } else if (step === 'working'){
    el.innerHTML = '<p class="empty">Straightening and cropping…</p>';
  } else if (step === 'preview'){
    const url = SC.out.toDataURL('image/jpeg', 0.8);
    el.innerHTML = '<img class="scan-big" src="'+url+'" alt="Preview of the scanned check">'+
      (!SC.found && SC.auto ? '<p class="hint" style="margin:0">The check\'s edges were not clear, so the whole picture is kept. Rotate it if needed.</p>' : '')+
      '<div class="row" style="gap:8px;flex-wrap:wrap"><button type="button" class="btn sm" onclick="scanRotate(-90)" aria-label="Rotate left">↺ Rotate left</button><button type="button" class="btn sm" onclick="scanRotate(90)" aria-label="Rotate right">↻ Rotate right</button>'+
      '<button type="button" class="btn sm ghost" onclick="SC.auto=!SC.auto;scanRender()">'+(SC.auto ? 'Undo auto-crop' : 'Auto-crop again')+'</button></div>'+
      '<div class="row" style="gap:8px;justify-content:space-between;flex-wrap:wrap"><button type="button" class="btn ghost" onclick="scanStep(\'choose\')">Scan again</button><button type="button" class="btn primary" id="scUse" onclick="scanUse()">'+ic('check')+'Use this scan</button></div>';

async function scanCamera(){
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){ scanStep('choose', 'This browser cannot use a camera here. Choose a scanned file instead.'); return; }
  try{ SC.stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment', width: { ideal: 1920 }, height: { ideal: 1080 } }, audio: false }); scanStep('camera'); }
  catch(e){ scanStep('choose', 'The camera could not be opened ('+(e.name==='NotAllowedError'?'permission was not given':e.name==='NotFoundError'?'no camera found':e.message)+'). Choose a scanned file instead.'); }
}
function scanSnap(){
  const v = document.getElementById('scVid'); if (!v || !v.videoWidth) return;
  const c = document.createElement('canvas'); c.width = v.videoWidth; c.height = v.videoHeight; c.getContext('2d').drawImage(v, 0, 0);
  scanProcess(c);
}
async function scanFile(file){
  if (!file) return;
  scanStep('working');
  try{
    let c;
    if (/pdf/i.test(file.type) || /\.pdf$/i.test(file.name)){
      const lib = await loadPdfJs(), doc = await lib.getDocument({ data: new Uint8Array(await file.arrayBuffer()) }).promise, pg = await doc.getPage(1);
      const vp0 = pg.getViewport({ scale: 1 }), vp = pg.getViewport({ scale: Math.min(3, 2400 / Math.max(vp0.width, vp0.height)) });
      c = document.createElement('canvas'); c.width = Math.round(vp.width); c.height = Math.round(vp.height);
      const g = c.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, c.width, c.height);
      await pg.render({ canvasContext: g, viewport: vp }).promise;
    } else {
      let bmp; try{ bmp = await createImageBitmap(file, { imageOrientation: 'from-image' }); }
      catch(e){ bmp = await new Promise((ok, no) => { const im = new Image(), u = URL.createObjectURL(file); im.onload = () => { URL.revokeObjectURL(u); ok(im); }; im.onerror = () => no(new Error('That file is not a picture the browser can open.')); im.src = u; }); }
      const w = bmp.width, h = bmp.height, k = Math.min(1, 3200 / Math.max(w, h));
      c = document.createElement('canvas'); c.width = Math.round(w * k); c.height = Math.round(h * k); c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height);
    }
    scanProcess(c);
  }catch(e){ scanStep('choose', 'Could not read that file: '+e.message); }
}
function scanProcess(c){
  scanStep('working');
  setTimeout(() => { SC.src = c; SC.rot = 0; SC.auto = true; const r = autoCropCheck(c); SC.crop = r.canvas; SC.found = r.found; scanRender(); }, 20);
}
function scanRender(){
  const base = SC.auto ? SC.crop : landscape_(SC.src);
  SC.out = fitScan_(rotateCanvas_(base, SC.rot));
  scanStep('preview');
}
function scanRotate(d){ SC.rot = (SC.rot + d + 360) % 360; scanRender(); }
async function scanUse(){
  let q = 0.72, url = SC.out.toDataURL('image/jpeg', q);
  while (url.length > 1300000 && q > 0.35){ q -= 0.1; url = SC.out.toDataURL('image/jpeg', q); }
  const scan = { url, mime:'image/jpeg', data: url.split(',')[1], width: SC.out.width, height: SC.out.height };
  const t = SC.target; closeScanner();
  if (t && t.kind === 'form'){ S.ck.scan = scan; render(); return; }
  if (t && t.kind === 'payment') await uploadScan(t.pid, scan);
}
async function uploadScan(pid, scan){
  try{
    const pj = await sbRpc('bf_add_check_scan', {p_token:TOKEN, p_payment_id:pid, p_mime:scan.mime, p_data:scan.data, p_width:scan.width, p_height:scan.height});

/* image helpers */
function landscape_(c){ return c.height > c.width * 1.05 ? rotateCanvas_(c, 90) : c; }
function rotateCanvas_(c, deg){
  if (!deg) return c;
  const o = document.createElement('canvas'), q = deg % 180 !== 0;
  o.width = q ? c.height : c.width; o.height = q ? c.width : c.height;
  const g = o.getContext('2d'); g.translate(o.width / 2, o.height / 2); g.rotate(deg * Math.PI / 180); g.drawImage(c, -c.width / 2, -c.height / 2);
  return o;
}
function fitScan_(c){   // long side at most 1600px, gentle auto-contrast
  const k = Math.min(1, 1600 / Math.max(c.width, c.height));
  const o = document.createElement('canvas'); o.width = Math.max(1, Math.round(c.width * k)); o.height = Math.max(1, Math.round(c.height * k));
  const g = o.getContext('2d'); g.imageSmoothingQuality = 'high'; g.fillStyle = '#fff'; g.fillRect(0, 0, o.width, o.height); g.drawImage(c, 0, 0, o.width, o.height);
  try{
    const im = g.getImageData(0, 0, o.width, o.height), d = im.data, hist = new Uint32Array(256), n = d.length / 4;
    for (let i = 0; i < d.length; i += 16) hist[(d[i]*77 + d[i+1]*150 + d[i+2]*29) >> 8]++;
    const tot = Math.ceil(n / 4); let lo = 0, hi = 255, acc = 0;
    for (let v = 0; v < 256; v++){ acc += hist[v]; if (acc > tot * 0.01){ lo = v; break; } }
    acc = 0; for (let v = 255; v >= 0; v--){ acc += hist[v]; if (acc > tot * 0.01){ hi = v; break; } }
    if (hi - lo > 40 && (lo > 8 || hi < 247)){
      const s = 255 / (hi - lo);
      for (let i = 0; i < d.length; i += 4){ d[i] = Math.max(0, Math.min(255, (d[i]-lo)*s)); d[i+1] = Math.max(0, Math.min(255, (d[i+1]-lo)*s)); d[i+2] = Math.max(0, Math.min(255, (d[i+2]-lo)*s)); }
      g.putImageData(im, 0, 0);
    }
  }catch(e){}
  return o;
}
/* Find the check against the background (scanner lid, desk), then cut it out straight.
   Returns {canvas, found}. */
function autoCropCheck(src){
  const W0 = src.width, H0 = src.height, k = Math.min(1, 640 / Math.max(W0, H0));
  const w = Math.max(8, Math.round(W0 * k)), h = Math.max(8, Math.round(H0 * k));
  const sm = document.createElement('canvas'); sm.width = w; sm.height = h; const sg = sm.getContext('2d'); sg.drawImage(src, 0, 0, w, h);
  const d = sg.getImageData(0, 0, w, h).data;
  // background = median colour of a 3px frame
  const fr = [[], [], []];
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++){ if (x > 2 && x < w-3 && y > 2 && y < h-3) continue; const i = (y*w + x)*4; fr[0].push(d[i]); fr[1].push(d[i+1]); fr[2].push(d[i+2]); }
  const med = a => { a.sort((p, q) => p - q); return a[a.length >> 1]; };
  const bg = fr.map(med);
  let noise = 0, nn = 0;
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++){ if (x > 2 && x < w-3 && y > 2 && y < h-3) continue; const i = (y*w + x)*4; noise += Math.abs(d[i]-bg[0]) + Math.abs(d[i+1]-bg[1]) + Math.abs(d[i+2]-bg[2]); nn++; }
  noise /= Math.max(1, nn);
  const T = Math.max(30, noise * 3 + 14);
  const lum = new Float32Array(w*h);
  for (let p = 0; p < w*h; p++) lum[p] = d[p*4]*0.299 + d[p*4+1]*0.587 + d[p*4+2]*0.114;
  let m = new Uint8Array(w*h);
  for (let y = 1; y < h-1; y++) for (let x = 1; x < w-1; x++){
    const p = y*w + x, i = p*4;
    const diff = Math.abs(d[i]-bg[0]) + Math.abs(d[i+1]-bg[1]) + Math.abs(d[i+2]-bg[2]);
    const gx = lum[p+1] - lum[p-1], gy = lum[p+w] - lum[p-w];
    if (diff > T || gx*gx + gy*gy > 900) m[p] = 1;
  }
  // close small gaps: dilate then erode (3x3, twice)
  const morph = (a, grow) => { const o = new Uint8Array(w*h); for (let y = 1; y < h-1; y++) for (let x = 1; x < w-1; x++){ const p = y*w + x; let s = 0;
      for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) s += a[p + dy*w + dx]; o[p] = grow ? (s > 0 ? 1 : 0) : (s === 9 ? 1 : 0); } return o; };
  m = morph(morph(m, true), true); m = morph(morph(m, false), false);
  // largest connected region
  const lab = new Int32Array(w*h); let best = 0, bestN = 0, cur = 0; const st = [];
  for (let p0 = 0; p0 < w*h; p0++){
    if (!m[p0] || lab[p0]) continue; cur++; let n = 0; st.push(p0); lab[p0] = cur;
    while (st.length){ const p = st.pop(); n++; const x = p % w, y = (p / w) | 0;
      if (x > 0 && m[p-1] && !lab[p-1]){ lab[p-1] = cur; st.push(p-1); } if (x < w-1 && m[p+1] && !lab[p+1]){ lab[p+1] = cur; st.push(p+1); }
      if (y > 0 && m[p-w] && !lab[p-w]){ lab[p-w] = cur; st.push(p-w); } if (y < h-1 && m[p+w] && !lab[p+w]){ lab[p+w] = cur; st.push(p+w); } }
    if (n > bestN){ bestN = n; best = cur; }
  }
  const fallback = () => ({ canvas: landscape_(src), found: false });
  if (!best || bestN < w*h*0.06) return fallback();
  // outline points (row extremes + column extremes) -> convex hull
  const pts = [];
  for (let y = 0; y < h; y++){ let a = -1, b = -1; for (let x = 0; x < w; x++) if (lab[y*w + x] === best){ if (a < 0) a = x; b = x; } if (a >= 0){ pts.push([a, y], [b + 1, y], [a, y + 1], [b + 1, y + 1]); } }
  pts.sort((p, q) => p[0] - q[0] || p[1] - q[1]);
  const cross = (o, a, b) => (a[0]-o[0])*(b[1]-o[1]) - (a[1]-o[1])*(b[0]-o[0]);
  const lower = [], upper = [];
  for (const p of pts){ while (lower.length >= 2 && cross(lower[lower.length-2], lower[lower.length-1], p) <= 0) lower.pop(); lower.push(p); }
  for (let i = pts.length - 1; i >= 0; i--){ const p = pts[i]; while (upper.length >= 2 && cross(upper[upper.length-2], upper[upper.length-1], p) <= 0) upper.pop(); upper.push(p); }
  const hull = lower.slice(0, -1).concat(upper.slice(0, -1));
  if (hull.length < 3) return fallback();
  // minimum-area rectangle around the hull (rotating calipers)
  let bestA = Infinity, R = null;
  for (let i = 0; i < hull.length; i++){
    const a = hull[i], b = hull[(i + 1) % hull.length], L = Math.hypot(b[0]-a[0], b[1]-a[1]); if (L < 1e-6) continue;
    const ux = (b[0]-a[0]) / L, uy = (b[1]-a[1]) / L, vx = -uy, vy = ux;
    let u0 = Infinity, u1 = -Infinity, v0 = Infinity, v1 = -Infinity;
    for (const p of hull){ const pu = p[0]*ux + p[1]*uy, pv = p[0]*vx + p[1]*vy; if (pu < u0) u0 = pu; if (pu > u1) u1 = pu; if (pv < v0) v0 = pv; if (pv > v1) v1 = pv; }
    const A = (u1 - u0) * (v1 - v0); if (A < bestA){ bestA = A; R = { ux, uy, u0, u1, v0, v1 }; }
  }
  const rw = R.u1 - R.u0, rh = R.v1 - R.v0;
  if (rw * rh > w*h*0.97) return fallback();
  // long side horizontal, smallest turn
  let lx = rw >= rh ? R.ux : -R.uy, ly = rw >= rh ? R.uy : R.ux;
  if (lx < 0 || (lx === 0 && ly < 0)){ lx = -lx; ly = -ly; }
  const px = -ly, py = lx;
  let a0 = Infinity, a1 = -Infinity, b0 = Infinity, b1 = -Infinity;
  for (const p of hull){ const pu = p[0]*lx + p[1]*ly, pv = p[0]*px + p[1]*py; if (pu < a0) a0 = pu; if (pu > a1) a1 = pu; if (pv < b0) b0 = pv; if (pv > b1) b1 = pv; }
  const pad = 0.003 * Math.max(a1 - a0, b1 - b0); a0 -= pad; a1 += pad; b0 -= pad; b1 += pad;
  const s = 1 / k, OW = Math.round((a1 - a0) * s), OH = Math.round((b1 - b0) * s);
  const out = document.createElement('canvas'); out.width = Math.max(1, OW); out.height = Math.max(1, OH);
  const g = out.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, out.width, out.height);
  const ox = (a0*lx + b0*px) * s, oy = (a0*ly + b0*py) * s;          // rectangle corner in source pixels
  g.setTransform(lx, px, ly, py, -(lx*ox + ly*oy), -(px*ox + py*oy));
  g.drawImage(src, 0, 0);
  g.setTransform(1, 0, 0, 1, 0, 0);
  return { canvas: out, found: true, angle: Math.atan2(ly, lx) * 180 / Math.PI };
}

function render(){
  const active = document.activeElement, aid = active && active.id, selS = active && active.selectionStart;
  if (S.view==='apps') root.innerHTML = viewApps();
  else if (S.view==='form'){ root.innerHTML = viewForm(); bindForm(); }
  else if (S.view==='pdf' && PDF_FORMS[S.form]){ root.innerHTML = viewPdfForm(); if (S.form==='subdivision') subFee(); }
  else if (isPhone()) root.innerHTML = viewPhoneBlock();
  else if (!S.staff){ root.innerHTML = viewPin();
    document.getElementById('pinf').onsubmit = staffSignIn; }
  else if (!routeAllowed(S.view)){
    const from = S.view; S.view = homeView(); S.form = null; S.sel = null;
    try{ history.replaceState(null, '', '#'+S.view); }catch(e){}
    if (from!=='staff' && from!=='apps') setTimeout(() => toast('That page is not part of your workspace.'), 0);
    if (S.view==='clerk') clerkLoad(); else if (S.view==='staff' && !S.loaded) loadSubs();
    return render(); }

function parseCsv(text){
  const rows = []; let row = [], f = '', q = false;
  text = text.replace(/^﻿/, '');
  for (let i = 0; i < text.length; i++){
    const c = text[i];
    if (q){ if (c === '"'){ if (text[i+1] === '"'){ f += '"'; i++; } else q = false; } else f += c; }
    else if (c === '"') q = true;
    else if (c === ','){ row.push(f); f = ''; }
    else if (c === '\n' || c === '\r'){ if (c === '\r' && text[i+1] === '\n') i++; row.push(f); f = ''; if (row.some(x => x !== '')) rows.push(row); row = []; }
    else f += c;
  }
  row.push(f); if (row.some(x => x !== '')) rows.push(row);
  return rows;
}

    put('projectType', get('what type of project is this'));

    put('comValue', String(moneyNum(get('commercial construction value','background commercial construction value')) || ''));
    put('exempt', get('are you an authorized employee of a federal state or local government general contractor or property owner acting as your own contractor'));
  } else if (form==='sign'){

  const urls = get('please upload proof of arab city business license trade license contract invoice and insurance','upload the required documents for your selected sign type including the applicable plot plan or building suite drawing')
    .split(/\s+/).filter(u => /^https?:\/\//.test(u));

      const cIdx = H.indexOf(n.toLowerCase(), b+3); const com = cIdx >= 0 ? (r[cIdx]||'').trim() : ''; if (com) rec.comments = com;

async function readZip(buf){
  const dv = new DataView(buf), u8 = new Uint8Array(buf), td = new TextDecoder();
  let e = -1; for (let i = buf.byteLength - 22; i >= Math.max(0, buf.byteLength - 70000); i--) if (dv.getUint32(i, true) === 0x06054b50){ e = i; break; }

    if (dv.getUint32(p, true) !== 0x02014b50) break;
    const method = dv.getUint16(p + 10, true), comp = dv.getUint32(p + 20, true), nl = dv.getUint16(p + 28, true), xl = dv.getUint16(p + 30, true), cl = dv.getUint16(p + 32, true), lo = dv.getUint32(p + 42, true);
    const name = td.decode(u8.subarray(p + 46, p + 46 + nl));

      const start = lo + 30 + dv.getUint16(lo + 26, true) + dv.getUint16(lo + 28, true);
      out.push({ name, base: name.split('/').pop(), method, data: u8.subarray(start, start + comp) });
    }
    p += 46 + nl + xl + cl;
  }

async function unzipEntry(en){

function jfUrlParts(url){ const m = String(url).match(/\/uploads\/[^/]+\/(\d+)\/(\d+)\/([^/?#]+)/); if (!m) return null; let f = m[3]; try{ f = decodeURIComponent(f); }catch(e){} return { form:m[1], sub:m[2], file:f }; }
