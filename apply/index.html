    '<div class="fld"><label class="l" for="bgWhat">What went wrong? <span class="req" style="color:var(--red)">*</span></label><textarea id="bgWhat" required rows="4" placeholder="Example: The PDF button spins and never downloads."></textarea></div>'+
    '<div class="fld"><label class="l" for="bgSteps">What were you doing just before? <span class="hint">(optional)</span></label><textarea id="bgSteps" rows="2" placeholder="Example: Opened a Sub Trade application, clicked PDF with documents."></textarea></div>'+
    '<div class="fld"><span class="l" id="bgUrgL">How much does it get in the way?</span><div class="opts" role="radiogroup" aria-labelledby="bgUrgL">'+[['low','Minor'],['normal','Slows me down'],['high','I can\'t do my work']].map((o,i)=>'<label class="opt"><input type="radio" name="bgUrg" value="'+o[0]+'"'+(i===1?' checked':'')+'> '+o[1]+'</label>').join('')+'</div></div>'+
    '<span class="formerr" id="bgErr"></span>'+
    '<div class="row" style="justify-content:flex-end;gap:8px"><button type="button" class="btn" onclick="closeBug()">Cancel</button><button class="btn primary" id="bgBtn">Send report</button></div></form>';
  document.body.appendChild(d);
  document.getElementById('bugf').onsubmit = sendBug;
  document.getElementById('bgWhat').focus();
  document.addEventListener('keydown', bugEsc);
}
function bugEsc(e){ if (e.key === 'Escape') closeBug(); }
function closeBug(){ const d = document.getElementById('bugbox'); if (d) d.remove(); document.removeEventListener('keydown', bugEsc); }
async function sendBug(e){
  e.preventDefault();
  const what = document.getElementById('bgWhat').value.trim(), err = document.getElementById('bgErr'), btn = document.getElementById('bgBtn');
  if (!what){ err.textContent = 'Describe what went wrong.'; return; }
  const areaV = document.getElementById('bgArea').value, area = (AREAS.find(a=>a[0]===areaV)||[,''])[1];
  const urg = (document.querySelector('input[name=bgUrg]:checked')||{}).value || 'normal';
  const rep = { app:APP_TAG, kind:'bug', createdAt:new Date().toISOString(), area, what, steps:document.getElementById('bgSteps').value.trim(), urgency:urg,
    by:(S.me&&S.me.name)||'', byEmail:(S.me&&S.me.email)||'', page:S.view+(S.form?' / '+S.form:'')+(S.sel?' / application '+refNo(S.sel):''), browser:navigator.userAgent.slice(0,200) };
  btn.disabled = true; err.textContent = '';
  let saved = true; try{ await sbRpc('bf_add', {p_token:TOKEN, p_collection:'suggestions', p_data:rep}); }catch(x){ saved = false; }
  const body = 'Bug report from the Building Department staff portal\n\nFrom: '+rep.by+' <'+rep.byEmail+'>\nWhen: '+fmtDT(rep.createdAt)+'\nWhere: '+area+'\nHow much it gets in the way: '+({low:'Minor',normal:'Slows me down',high:"I can't do my work"})[urg]+'\n\nWhat went wrong:\n'+what+(rep.steps?'\n\nWhat they were doing just before:\n'+rep.steps:'')+'\n\nPage: '+rep.page+'\nBrowser: '+rep.browser;
  const mail = 'mailto:'+BUG_EMAIL+'?subject='+encodeURIComponent('Staff portal bug: '+what.slice(0,60))+'&body='+encodeURIComponent(body);
  document.getElementById('bugf').innerHTML = '<h2 style="font:800 20px var(--f-disp)">'+(saved?'Thanks, your report was saved':'Your report could not be saved')+'</h2>'+
    '<p style="margin:0;color:var(--ink2)">'+(saved?'Jade will see it in the bug reports list. To also email it, open it in your email app and press Send.':'Please email it instead so it is not lost.')+'</p>'+
    '<div class="row" style="justify-content:flex-end;gap:8px"><a class="btn primary" href="'+esc(mail)+'">'+ic('ext')+'Email it to Jade</a><button type="button" class="btn" onclick="closeBug()">Done</button></div>'+
    '<p class="hint" style="margin:0;color:var(--muted);font-size:12.5px">Email address: <span style="user-select:all">'+BUG_EMAIL+'</span></p>';
}
async function loadBugs(){
  try{ const r = await sbRpc('bf_query', {p_token:TOKEN, p_collection:'suggestions', p_where_field:'kind', p_where_value:'bug', p_order_field:'createdAt', p_order_dir:'desc', p_limit:200});
    S.bugs = (r||[]).map(x => Object.assign({}, x.data, {id:x.id})); }
  catch(e){ S.bugs = {err:e.message}; }
  if (S.view === 'bugs') render();
}
function viewBugs(){
  const b = S.bugs;
  return topBar()+'<div class="purge"><div class="row"><button class="btn sm" onclick="go(\'staff\')">'+ic('left')+'Workspace</button><span style="flex:1"></span><button class="btn sm" onclick="S.bugs=null;render()">Refresh</button></div><h1>Bug reports</h1>'+
   (!b ? '<p class="empty">Loading reports…</p>' : b.err ? '<p class="empty">Could not load reports: '+esc(b.err)+'</p>' : !b.length ? '<p class="empty">No bug reports. Staff can send one with "Report bugs" at the bottom of any staff page.</p>' :
   b.map(r => '<div class="card"><div class="row" style="justify-content:space-between"><b>'+esc(r.area||'')+'</b><span class="pill '+(r.urgency==='high'?'unpaid':'src')+'">'+({low:'Minor',normal:'Slows them down',high:"Can't work"})[r.urgency]+'</span></div>'+
     '<p style="margin:0;white-space:pre-wrap">'+esc(r.what)+'</p>'+(r.steps?'<p style="margin:0;color:var(--ink2);white-space:pre-wrap"><b>Before:</b> '+esc(r.steps)+'</p>':'')+
     '<p class="num" style="margin:0;color:var(--muted);font-size:13px">'+esc(r.by||'')+' · '+esc(r.byEmail||'')+' · '+fmtDT(r.createdAt)+' · '+esc(r.page||'')+'</p>'+
     '<div class="row">'+(S.bugDel===r.id?'<span>Delete this report?</span><button class="btn sm danger" onclick="delBug(\''+r.id+'\')">Delete</button><button class="btn sm ghost" onclick="S.bugDel=null;render()">Keep</button>':'<button class="btn sm ghost" onclick="S.bugDel=\''+r.id+'\';render()">'+ic('trash')+'Delete (fixed)</button>')+'</div></div>').join(''))+'</div>';
}
async function delBug(id){
  try{ await sbRpc('bf_delete', {p_token:TOKEN, p_collection:'suggestions', p_id:id}); S.bugs = S.bugs.filter(x=>x.id!==id); S.bugDel = null; toast('Report deleted'); }
  catch(e){ toast('Could not delete: '+e.message); }
  render();
}
(async function boot(){
  if (SB_KEY.indexOf('PASTE_')===0) return;
  sbRpc('bf_storage_status', {}).then(st => { S.storage = st; if (st && st.full){ S.pubFull = true; if (S.view==='form'){ const k = S.form; render(); } } }).catch(()=>{});
  if (TOKEN){
    try{ const me = await sbRpc('bf_me', {p_token:TOKEN});
      if (me && hasPortal(me)){ S.me = me; S.staff = true; render(); if (canBuilding()) await loadSubs(); if (S.view==='clerk') clerkLoad(); }
      else { signOutLocal(); render(); }
    }catch(e){}
  }
  setInterval(()=>{ if (S.staff && document.visibilityState==='visible' && (S.view==='staff'||S.view==='table')) loadSubs(); }, 30000);
})();
</script>
</body>
</html>
