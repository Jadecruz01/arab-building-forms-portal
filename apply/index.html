const pdfSafe = t => String(t==null?'':t).replace(/[‘’]/g,"'").replace(/[“”]/g,'"').replace(/[–—]/g,'-').replace(/[^\x0A\x20-\x7E\xA0-\xFF]/g,'?');
async function buildPdf(s){
  const { PDFDocument, StandardFonts, rgb } = PDFLib;
  const pdf = await PDFDocument.create();
  const reg = await pdf.embedFont(StandardFonts.Helvetica), bold = await pdf.embedFont(StandardFonts.HelveticaBold);
  const F = FORMS[s.form], st = s.staff||{}, W=612, H=792, M=46;
  const navy = rgb(0.06,0.2,0.45), grey = rgb(0.42,0.45,0.6), line = rgb(0.86,0.88,0.92);
  let page, y;
  const wrap = (t, font, size, width) => { const out=[]; pdfSafe(t).split('\n').forEach(par=>{ let cur=''; par.split(/\s+/).forEach(w=>{ const tryL = cur?cur+' '+w:w; if (font.widthOfTextAtSize(tryL,size) > width && cur){ out.push(cur); cur=w; } else cur=tryL; }); out.push(cur); }); return out; };
  const newPage = () => { page = pdf.addPage([W,H]);
    page.drawRectangle({x:0,y:H-70,width:W,height:70,color:navy});
    page.drawText('City of Arab Building Department', {x:M,y:H-32,size:15,font:bold,color:rgb(1,1,1)});
    page.drawText(pdfSafe(F.title), {x:M,y:H-52,size:10.5,font:reg,color:rgb(0.95,0.76,0.19)});
    page.drawText(pdfSafe('Permit # '+(st.permitNo||'not assigned')), {x:W-M-bold.widthOfTextAtSize('Permit # '+(st.permitNo||'not assigned'),10.5),y:H-32,size:10.5,font:bold,color:rgb(1,1,1)});
    y = H-96; };
  const head = t => { if (y<90) newPage(); y-=6; page.drawText(pdfSafe(t.toUpperCase()), {x:M,y,size:9,font:bold,color:grey}); y-=6; page.drawLine({start:{x:M,y},end:{x:W-M,y},thickness:.7,color:line}); y-=14; };
  const row = (l, v) => { const ll = wrap(l,bold,9.5,170), vl = wrap(v,reg,10,W-2*M-185); const h = Math.max(ll.length, vl.length)*13+5;
    if (y-h < 50) newPage();
    ll.forEach((t,i)=>page.drawText(t,{x:M,y:y-i*13,size:9.5,font:bold,color:rgb(0.2,0.24,0.42)}));
    vl.forEach((t,i)=>page.drawText(t,{x:M+185,y:y-i*13,size:10,font:reg,color:rgb(0.04,0.08,0.3)}));
    y -= h; };
  newPage();
  row('Submitted', fmtDT(s.createdAt)); row('Applicant', s.fields.applicant||''); row('Property address', s.fields.address||'');
  let sec = null;
  F.fields.forEach(x=>{ if (x.type==='section'){ sec = x.label; return; } if (!x.id||x.type==='file'||x.type==='note') return;
    const v = s.fields[x.id]; if (v==null||v==='') return; if (sec){ head(sec); sec=null; }
    row(x.label, x.type==='money'?money(num(v)):v); });
  if (Array.isArray(s.agreements) && s.agreements.length){ head('Terms & agreements'); s.agreements.forEach(a => row(a.title||a.id, 'Agreed '+fmtDT(a.at))); }
  { const lm = linkedMain(s), ls = linkedSubs(s);
    if (lm || ls.length){ head(s.form==='subtrade' ? 'Linked building permit' : 'Linked sub trade applications');
      (lm ? [lm] : ls).forEach(x => x.missing ? row('Building permit', 'Linked application is no longer on file') :
        row((FORMS[x.form]||{}).short||x.form, [x.fields.applicant||'Applicant', x.fields.address, (x.staff&&x.staff.permitNo)?'Permit # '+x.staff.permitNo:'', 'Ref '+refNo(x.id)].filter(Boolean).join('  ·  '))); } }
  const fe = s.fees||{}; head('Fees');
  if (isBldg(s.form)||s.form==='subtrade'){ row('Construction value', money(fe.value)+(fe.basis?'  ('+fe.basis+')':'')); }
  row('Permit fee', money(fe.permit)+(fe.doubled?'  (doubled - work started without permit)':''));
  if (isBldg(s.form)||s.form==='subtrade') row('CICT fee', money(fe.cict));
  row('Grand total', money(fe.total));
  head('Office use');
  row('Payment', payText(s)+(s.pay&&s.pay.lastReceipt?'  ·  receipt '+s.pay.lastReceipt:''));
  row('Approval', [st.approvedBy, st.approvedDate].filter(Boolean).join('  ·  ')||'-');
  if (st.inspections) INSPECT.forEach(n=>{ const r=st.inspections[n]||{}; if (r.date||r.by||r.recorded||r.comment) row(n+' inspection', [r.date&&'Inspected '+r.date, r.by&&'by '+r.by, r.recorded&&'recorded '+r.recorded].filter(Boolean).join(', ')+(r.comment?'\nComments: '+r.comment:'')); });
  if (st.co) row('Certificate of Occupancy', st.co+(st.coInit?'  ·  '+st.coInit:'')+(st.coComments?'\n'+st.coComments:'')+(st.co==='Given'&&st.coOverrideInit?'\nGiven before payment by override: initials '+st.coOverrideInit+(st.coOverrideBy?' ('+st.coOverrideBy+')':'')+(st.coOverrideAt?', '+fmtDT(st.coOverrideAt):'')+(st.coOverrideBalance!=null?', '+money(st.coOverrideBalance)+' due at the time':''):''));
  if (st.comments) row('Staff comments', st.comments);
  const fl = await loadAtt(s.id), ext = (s.files||[]).filter(f=>f.url);
  head('Documents attached ('+(fl.length+ext.length)+')');
  fl.forEach((f,i)=>row('Document '+(i+1), f.name+(f.compressed&&f.origSize?'\nOriginal size '+mb(f.origSize)+(f.origName&&f.origName!==f.name?' ('+f.origName+')':'')+' - compressed to '+mb(f.size)+' for storage':(f.size?'\n'+mb(f.size):''))));
  ext.forEach((f,i)=>row('Document '+(fl.length+i+1), f.name+'\nStored in the previous online forms system: '+f.url));
  const formPages = pdf.getPageCount();
  // attachments
  for (const f of fl){
    try{
      const buf = dataUrlBytes(f.data);
      if (/pdf/.test(f.type)){ const src = await PDFDocument.load(buf,{ignoreEncryption:true}); const pgs = await pdf.copyPages(src, src.getPageIndices()); pgs.forEach(p=>pdf.addPage(p)); }
      else if (/image\/(png|jpe?g)/.test(f.type)){
        const img = /png/.test(f.type) ? await pdf.embedPng(buf) : await pdf.embedJpg(buf);
        const p = pdf.addPage([W,H]); p.drawText(pdfSafe(f.name+(sizeNote(f)?'  ·  '+sizeNote(f):'')),{x:M,y:H-34,size:9,font:reg,color:grey});
        const sc = Math.min((W-2*M)/img.width, (H-2*M-20)/img.height, 1); const w=img.width*sc, h=img.height*sc;
        p.drawImage(img,{x:(W-w)/2,y:(H-20-h)/2,width:w,height:h});
      } else throw 0;
    }catch(e){ const p = pdf.addPage([W,H]); p.drawText(pdfSafe('Could not include '+f.name+'. Open it from the Documents tab.'),{x:M,y:H-60,size:11,font:reg}); }
  }
  pdf.getPages().forEach((p,i)=>{ if (i<formPages) p.drawText(pdfSafe('Page '+(i+1)+' of '+formPages+'  ·  generated '+fmtDT(new Date().toISOString())),{x:M,y:24,size:8,font:reg,color:grey}); });
  return pdf.save();
}
async function downloadPdf(sid){
  const s = sid ? S.subs.find(x=>x.id===sid) : curSub(); if (!s) return; const b = document.getElementById('pdfBtn');
  if (!window.PDFLib){ toast('The PDF tool did not load. Check your connection and try again.'); return; }
  try{ if (b){ b.disabled=true; b.textContent='Building PDF…'; }
    const bytes = await buildPdf(s);
    const nm = ('Permit-'+((s.staff&&s.staff.permitNo)||fmtDate(s.createdAt))+'-'+(s.fields.applicant||'')).replace(/[^A-Za-z0-9]+/g,'-').replace(/-+$/,'')+'.pdf';
    await DL.save({ filename:nm, data:bytes });
  }catch(e){ toast('Could not build the PDF: '+((e&&e.message)||'try again')); }
  finally{ render(); }
}

/* ================= fillable PDF forms (Annexation, Subdivision) =================
   The original City PDFs live in /apply/forms/. When an applicant opens one here,
   pdf-lib adds a typeable field over every blank and a checkbox over every box,
   so the whole document can be completed on a computer and emailed back. */
const PDF_EMAILS = ['buildingdept@arabcity.org', 'kjohnson@arabcity.org'];
const PDF_INFO = {
  annexation: { icon:'pin', blurb:'Apply to have property annexed into the City of Arab. There is no fee.',
    attach:'a copy of the current recorded deed(s) and the current tax parcel map',
    after:'Planning staff will review it. If the property qualifies, they will prepare the official Petition for Annexation for the owners to sign and have notarized. The process takes about 1 to 2 months.' },
  subdivision: { icon:'map', blurb:'Sketch, preliminary or final plat approval from the Arab Planning Commission. Review fees apply (see below).',
    attach:'your plat drawings, if you have them as PDFs',
    after:'Complete applications and drawings (3 sets for residential, 5 for commercial) must reach the office at least 25 days before the Planning Commission meeting, which is the 3rd Tuesday of each month.' }
};
const PDF_CACHE = {};
async function buildFillable(key){
  if (PDF_CACHE[key]) return PDF_CACHE[key];
  const D = PDF_FORMS[key], { PDFDocument, StandardFonts, rgb, PDFName, PDFString, PDFDict, PDFCheckBox } = PDFLib;
  const r = await fetch(D.src); if (!r.ok) throw new Error('The form could not be loaded ('+r.status+').');
  const pdf = await PDFDocument.load(await r.arrayBuffer(), { ignoreEncryption:true });
  const font = await pdf.embedFont(StandardFonts.Helvetica), form = pdf.getForm(), pages = pdf.getPages();
  const bg = rgb(0.91, 0.95, 1), border = rgb(0.45, 0.5, 0.65);
  D.fields.forEach(([p, k, x, y, w, h, name]) => {
    const page = pages[p]; if (!page) return;
    if (k === 1){ const cb = form.createCheckBox(name); cb.addToPage(page, { x, y, width:w, height:h, backgroundColor:bg, borderColor:border, borderWidth:0.6 }); }
    else { const tf = form.createTextField(name); if (k === 2) tf.enableMultiline();
      tf.addToPage(page, { x, y, width:w, height:h, font, backgroundColor:bg, borderWidth:0 }); tf.setFontSize(k === 2 ? 10 : (h < 12 ? 8 : 9)); }
  });
  form.updateFieldAppearances(font);
  // Checkboxes: give them what common PDF apps expect (check-mark font, an "Off" value
  // and a check caption), not only Chrome.
  const zadb = await pdf.embedFont(StandardFonts.ZapfDingbats);
  const af = form.acroForm.dict; let dr = af.lookup(PDFName.of('DR'));
  if (!(dr instanceof PDFDict)){ dr = pdf.context.obj({}); af.set(PDFName.of('DR'), dr); }
  let dfont = dr.lookup(PDFName.of('Font')); if (!(dfont instanceof PDFDict)){ dfont = pdf.context.obj({}); dr.set(PDFName.of('Font'), dfont); }
  dfont.set(PDFName.of('ZaDb'), zadb.ref);
  form.getFields().forEach(fl => { if (!(fl instanceof PDFCheckBox)) return;
    fl.acroField.dict.set(PDFName.of('DA'), PDFString.of('/ZaDb 0 Tf 0 g'));
    fl.acroField.dict.set(PDFName.of('V'), PDFName.of('Off'));
    fl.acroField.getWidgets().forEach(w => { w.getOrCreateAppearanceCharacteristics().setCaptions({ normal:'4' }); w.dict.set(PDFName.of('AS'), PDFName.of('Off')); });
  });
  pdf.setTitle(D.title+' - City of Arab');
  return PDF_CACHE[key] = await pdf.save();
}
async function pdfFormAction(key, how){
  const b = document.getElementById('pdfGo_'+how), err = document.getElementById('pdfErr');
  if (!window.PDFLib){ err.textContent = 'The PDF tool did not load. Check your connection and refresh the page.'; return; }
  const label = b ? b.innerHTML : ''; if (b){ b.disabled = true; b.textContent = 'Preparing the form…'; } err.textContent = '';
  try{
    const bytes = await buildFillable(key), blob = new Blob([bytes], {type:'application/pdf'});
    if (how === 'open'){ const u = URL.createObjectURL(blob), w = window.open(u, '_blank'); if (!w) await DL.save({ filename:PDF_FORMS[key].file, data:blob }); setTimeout(() => URL.revokeObjectURL(u), 600000); }
    else await DL.save({ filename:PDF_FORMS[key].file, data:blob });
  }catch(e){ err.textContent = 'Could not prepare the form: '+((e&&e.message)||'please try again.'); }
  if (b){ b.disabled = false; b.innerHTML = label; }
}
function pdfMailto(key){
  const D = PDF_FORMS[key];
  return 'mailto:'+PDF_EMAILS.join(',')+'?subject='+encodeURIComponent(D.title+' - [property address]')+'&body='+encodeURIComponent('Hello,\n\nAttached is my completed '+D.title+' for the property at: \n\nName:\nPhone:\n\nAttachments:\n- Completed '+D.title+' (PDF)\n- '+PDF_INFO[key].attach.replace(/^./,c=>c.toUpperCase())+'\n\nThank you.');
}
/* Subdivision review fees: City of Arab Resolution 2024-25R, Attachment B (adopted June 17, 2024), charged per review period */
const SUB_FEES = [
  ['minor', 'Minor subdivision (no more than 3 lots, no road construction)', 100],
  ['prelim', 'Preliminary plan, major subdivision', [100,150,300,500]],
  ['eng', 'Engineering plan, major subdivision', [500,650,750,950]],
  ['final', 'Final plat, major subdivision', [100,150,300,500]],
  ['resub', 'Re-subdivision', 100],
  ['cert', 'Certificate to subdivide and/or consolidate', 100],
  ['site', 'Site plan', 200]
];
const LOT_TIERS = ['2–10 lots','11–25 lots','25–40 lots','40 or more lots'];
const lotTier = n => n <= 10 ? 0 : n <= 25 ? 1 : n <= 40 ? 2 : 3;
function subFee(){
  const t = (document.getElementById('sfType')||{}).value || 'minor', f = SUB_FEES.find(x=>x[0]===t), lotsEl = document.getElementById('sfLots');
  const lots = Math.max(0, parseInt((lotsEl||{}).value, 10) || 0), tiered = Array.isArray(f[2]);
  const w = document.getElementById('sfLotsW'); if (w) w.style.display = tiered ? '' : 'none';
  const out = document.getElementById('sfOut'); if (!out) return;
  out.innerHTML = tiered && lots < 2 ? '<span style="color:var(--muted)">Enter the number of lots</span>' : '<b class="num" style="font-size:20px">'+money(tiered ? f[2][lotTier(lots)] : f[2])+'</b> <span style="color:var(--ink2)">per review period'+(tiered?' ('+LOT_TIERS[lotTier(lots)]+')':'')+'</span>';
}
function subFeeHtml(){
  const row = (l, v) => '<tr><td>'+l+'</td><td class="num" style="text-align:right">'+v+'</td></tr>';
  return '<div class="sect" style="margin-top:6px">Review fees</div>'+
   '<div class="feecalc"><div class="fld"><label class="l" for="sfType">What are you submitting?</label><select id="sfType" onchange="subFee()">'+SUB_FEES.map(f=>'<option value="'+f[0]+'">'+f[1]+'</option>').join('')+'</select></div>'+
   '<div class="fld" id="sfLotsW" style="display:none"><label class="l" for="sfLots">Number of lots</label><input id="sfLots" type="number" min="2" inputmode="numeric" oninput="subFee()"></div>'+
   '<div class="sfout" id="sfOut" aria-live="polite"></div></div>'+
   '<details class="feesched"><summary>Full fee schedule</summary><table class="fs">'+
     row('Minor subdivision (no more than 3 lots with no road construction)', '$100.00')+
     ['prelim','eng','final'].map(k=>{ const f = SUB_FEES.find(x=>x[0]===k); return '<tr><th colspan="2">'+f[1]+'</th></tr>'+f[2].map((v,i)=>row('&nbsp;&nbsp;'+LOT_TIERS[i], money(v))).join(''); }).join('')+
     row('Re-subdivision', '$100.00')+row('Certificate to subdivide and/or consolidate', '$100.00')+row('Site plan', '$200.00')+
   '</table><p class="hint" style="color:var(--muted);font-size:12.5px;margin:8px 0 0">Fees are per review period: one complete plan review cycle, including preliminary reviews, technical review and Planning Commission action. Source: City of Arab Resolution 2024-25R, Attachment B (June 17, 2024).</p></details>'+
   '<p style="margin:10px 0 0;color:var(--ink2);font-size:14px">Pay in person at City Hall, 740 N Main St, Arab, by cash or check made payable to “City of Arab.”</p>';
}

const myAccess = () => {
  const m = S.me || {}, a = m.access;
  if (a) return { building: !!a.building, payments: !!a.payments, admin: !!a.admin, records: !!(a.records || a.admin) };
  return { building: ['staff','admin'].includes(m.role), payments: ['clerk','admin'].includes(m.role), admin: m.role==='admin' };
};

const canPay = () => myAccess().payments;
const homeView = () => canBuilding() ? 'staff' : canPay() ? 'clerk' : 'me';
const hasPortal = acc => { const a = acc && acc.access; return a ? (a.building || a.payments) : !!acc && ['staff','clerk','admin'].includes(acc.role); };
function routeAllowed(v){
  if (v==='me' || v==='privacy-statement') return true;
  if (v==='clerk') return canPay();
  if (['users','bugs'].includes(v)) return isAdmin();
  if (v==='records') return canRecords();
  if (v==='staff' || v==='table' || v==='cict') return canBuilding();
  return false;
}
const ROLE_LABEL = { staff:'Building Department', clerk:'Municipal Support Clerk', admin:'Administrator', citizen:'No access' };
function goHome(){ go(homeView()); }

/* ================= payment status (one definition used everywhere) ================= */
const payStatus = s => {
  const p = s && s.pay; if (p && p.status) return p.status;
  if (s && s.staff && s.staff.payment && s.staff.payment!=='Please Select') return 'paid';
  return (s && s.fees && Number(s.fees.total) > 0) ? 'unpaid' : 'none';
};
const PAY_LABEL = { paid:'Paid', partial:'Partially paid', unpaid:'Unpaid', none:'No fee' };
const payPill = s => { const st = payStatus(s), p = (s && s.pay) || {};
  const extra = st==='paid' ? (p.lastMethod || (s.staff && s.staff.payment) || '') : st==='partial' ? money(p.balance)+' due' : '';
  return '<span class="pill '+({paid:'paid', partial:'partial', unpaid:'unpaid', none:'src'})[st]+'">'+PAY_LABEL[st]+(extra?' · '+esc(extra):'')+'</span>'; };
const payText = s => { const st = payStatus(s), p = (s && s.pay) || {};
  if (st==='paid') return 'Paid'+(p.lastMethod ? ' ('+p.lastMethod+(p.lastCheckNo?' #'+p.lastCheckNo:'')+')' : (s.staff && s.staff.payment ? ' ('+s.staff.payment+')' : ''));
  if (st==='partial') return 'Partially paid: '+money(p.paid)+' of '+money(p.total)+', '+money(p.balance)+' due';
  return PAY_LABEL[st]; };
const PAY_METHODS = ['Cash','Check','Money order','Other'];
const needsNo = m => m==='Check' || m==='Money order';
const todayISO = () => { const d = new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); };
const fmtDay = d => { if (!d) return ''; const x = new Date(String(d).slice(0,10)+'T12:00:00'); return isNaN(x) ? d : x.toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'}); };
const pmtLabel = p => p.kind==='reversal' ? 'Reversal' : p.kind==='legacy' ? 'Before payment tracking' : 'Payment';

/* Building Department "Office use" tab: payment is shown, never edited there. */
const PH = {};   // submission id -> payment history
async function loadPayHistory(id){ try{ PH[id] = await sbRpc('bf_payment_history', {p_token:TOKEN, p_sid:id}); }catch(e){ PH[id] = {err:e.message}; } if (S.sel===id) render(); }
function payBoxHtml(s){
  const st = payStatus(s), p = s.pay || {}, h = PH[s.id];
  if (h === undefined) setTimeout(() => { if (PH[s.id]===undefined){ PH[s.id] = null; loadPayHistory(s.id); } }, 0);
  const rows = Array.isArray(h) ? h : [];
  return '<div class="paybox"><div class="row" style="justify-content:space-between;gap:8px">'+payPill(s)+
    '<span class="num" style="color:var(--ink2)">'+(st==='none' ? 'No fee due' : 'Paid '+money(p.paid||((st==='paid')?(s.fees&&s.fees.total):0))+' of '+money(p.total!=null?p.total:(s.fees&&s.fees.total))+(st==='partial'?' · <b>'+money(p.balance)+' due</b>':''))+'</span></div>'+
    (rows.length ? '<ul class="paylist">'+rows.map(r => '<li class="'+(r.reversedBy?'rev':'')+'"><span class="num">'+esc(r.receiptNo)+'</span><span>'+pmtLabel(r)+(r.method?' · '+esc(r.method)+(r.checkNo?' #'+esc(r.checkNo):''):'')+(r.receivedOn?' · '+fmtDay(r.receivedOn):'')+(r.reversedBy?' · reversed':'')+'</span><b class="num">'+money(r.amount)+'</b></li>').join('')+'</ul>'+(rows.some(r=>r.scan)?'<div class="scan-row">'+rows.filter(r=>r.scan).map(scanThumbHtml).join('')+'</div>':'') : (h===null ? '<p class="hint">Loading payment history…</p>' : ''))+
    '<p class="hint" style="margin:6px 0 0;color:var(--muted);font-size:13px">Payments are recorded by the Municipal Support Clerk.'+(canPay()?'':' You can see the status here but cannot change it.')+'</p>'+
    (canPay() && st!=='none' ? '<button type="button" class="btn sm" style="margin-top:8px" onclick="clerkOpen(\''+s.id+'\')">'+ic('ext')+'Open in Payments</button>' : '')+
  '</div>';
}

/* ================= Municipal Support Clerk workspace ================= */
S.ck = { q:'', status:'due', results:null, sel:null, rec:null, f:null, step:'form', err:'', dupOk:false, done:null, tab:'find', day:todayISO(), dayRows:null, revFor:null };
let ckTimer = null;
function ckFreshForm(rec){ const bal = rec && rec.pay ? Number(rec.pay.balance) : 0;
  return { amount: bal > 0 ? bal.toFixed(2) : '', method:'', checkNo:'', on: todayISO(), note:'', req: null }; }
async function clerkSearch(){
  const my = (S.ck.seq = (S.ck.seq||0) + 1); S.ck.busy = true;
  try{ const r = await sbRpc('bf_clerk_search', {p_token:TOKEN, p_q:S.ck.q, p_status:S.ck.status, p_limit:50}); if (my!==S.ck.seq) return; S.ck.results = r || []; S.ck.err = ''; }
  catch(e){ if (my!==S.ck.seq) return; S.ck.results = []; S.ck.err = e.message; }
  S.ck.busy = false;
  if (S.view==='clerk' && !S.ck.sel) render();
}
async function clerkLoad(){ if (S.ck.sel && !S.ck.rec) return clerkLoadRec(S.ck.sel); if (!S.ck.results && !S.ck.busy) return clerkSearch(); }
async function clerkLoadRec(id){
  try{ const r = await sbRpc('bf_clerk_get', {p_token:TOKEN, p_sid:id}); if (S.ck.sel!==id) return; S.ck.rec = r; if (!S.ck.f) S.ck.f = ckFreshForm(r); }
  catch(e){ S.ck.rec = {err:e.message}; }
  if (S.view==='clerk') render();
}
function clerkOpen(id){ S.ck.scan = null; S.ck.sel = id; S.ck.rec = null; S.ck.f = null; S.ck.step = 'form'; S.ck.err = ''; S.ck.done = null; S.ck.revFor = null; S.ck.tab = 'find'; go('clerk'); clerkLoadRec(id); }
function clerkBack(){ S.ck.sel = null; S.ck.rec = null; S.ck.f = null; S.ck.done = null; S.ck.revFor = null; render(); clerkSearch(); }
function ckSet(k, v){ S.ck.f[k] = v; if (k==='method'){ S.ck.err=''; render(); } }

function ckReview(){
  const f = S.ck.f, bal = Number((S.ck.rec.pay||{}).balance)||0, amt = Number(String(f.amount).replace(/[$,\s]/g,''));
  S.ck.err = '';
  if (!(amt > 0)) S.ck.err = 'Enter the amount received.';
  else if (amt > bal + 0.004) S.ck.err = 'That is more than the balance due ('+money(bal)+').';
  else if (!f.method) S.ck.err = 'Choose how the payment was made.';
  else if (needsNo(f.method) && !String(f.checkNo).trim()) S.ck.err = 'Enter the '+f.method.toLowerCase()+' number.';
  else if (!f.on || f.on > todayISO()) S.ck.err = 'Enter the date the payment was received (not a future date).';
  if (S.ck.err){ render(); return; }
  f.amount = amt.toFixed(2); f.checkNo = String(f.checkNo).trim();
  if (!f.req) f.req = (crypto.randomUUID ? crypto.randomUUID() : 'xxxxxxxx-xxxx-4xxx-8xxx-xxxxxxxxxxxx'.replace(/x/g, () => (Math.random()*16|0).toString(16)));
  S.ck.step = 'confirm'; render();
}
async function ckRecord(allowDup){
  const C = S.ck, f = C.f, b = document.getElementById('ckGo'); if (b){ b.disabled = true; b.textContent = 'Recording…'; }
  try{
    const r = await sbRpc('bf_record_payment', { p_token:TOKEN, p_sid:C.sel, p_amount:Number(f.amount), p_method:f.method, p_check_no:needsNo(f.method)?f.checkNo:'',
      p_received_on:f.on, p_note:f.note||'', p_request_id:f.req, p_allow_duplicate:!!allowDup });
    C.rec = r.record; C.done = r.payment; C.step = 'form'; C.err = ''; C.f = ckFreshForm(r.record);
    syncSubPay(r.record); toast('Payment recorded');
    const scan = C.scan; C.scan = null; render(); window.scrollTo(0,0);
    if (scan && needsNo(r.payment.method)) await uploadScan(r.payment.id, scan);
    if (['Cash','Check','Money order'].includes(r.payment.method)) printPaperReceipt(r.payment.id);
    return;
  }catch(e){ C.err = e.message || 'Could not record the payment. Try again.'; if (!/^DUPLICATE/.test(C.err)) f.req = null; }
  render(); window.scrollTo(0,0);
}
async function ckReverse(id){
  const why = (document.getElementById('ckWhy')||{}).value || '';
  if (why.trim().length < 3){ toast('Explain why the payment is being reversed.'); return; }
  try{ const r = await sbRpc('bf_reverse_payment', {p_token:TOKEN, p_payment_id:id, p_reason:why});
    S.ck.rec = r.record; S.ck.done = r.payment; S.ck.revFor = null; S.ck.f = ckFreshForm(r.record); syncSubPay(r.record); toast('Payment reversed'); }
  catch(e){ toast('Could not reverse: '+e.message); }
  render(); window.scrollTo(0,0);
}
// keep the Building Department list (if loaded) in step with the server's new summary

/* ================= paper receipt: opens the computer's print dialog (any installed printer) ================= */
function printHtml(html){
  const old = document.getElementById('printFrame'); if (old) old.remove();
  const f = document.createElement('iframe'); f.id = 'printFrame'; f.title = 'Receipt to print'; f.setAttribute('aria-hidden', 'true');
  // The frame has a real letter-size page width. A 0×0 frame made some Windows browsers lay the
  // receipt out at a tiny width and then blow it up when printing.
  f.style.cssText = 'position:fixed;left:-10000px;top:0;width:816px;height:1056px;border:0;opacity:0;pointer-events:none';
  document.body.appendChild(f);
  const d = f.contentDocument; d.open(); d.write(html); d.close();
  const waits = [...d.images].map(i => i.complete ? null : new Promise(r => { i.onload = i.onerror = r; }));
  return Promise.race([Promise.all(waits), new Promise(r => setTimeout(r, 2500))]).then(() => {
    try{ f.contentWindow.focus(); f.contentWindow.print(); }catch(e){ toast('Could not open the print window: '+e.message); }
  });
}

/* ---- scanner: camera or a file from the scanner; auto crop, straighten and fit ---- */
const SC = { stream:null, src:null, out:null, rot:0, auto:true, target:null, busy:false, found:true };
function openScanner(target){
  closeScanner(); SC.target = target; SC.src = SC.out = null; SC.rot = 0; SC.auto = true;
  const box = document.createElement('div'); box.id = 'scanbox';
  box.innerHTML = '<div class="veil"></div><div class="scandlg" role="dialog" aria-modal="true" aria-labelledby="scT"><h2 id="scT" style="margin:0;font:700 17px var(--f-body)">Scan the '+(target.label||'check')+'</h2><div id="scBody"></div></div>';
  document.body.appendChild(box); document.addEventListener('keydown', scannerKey); scanStep('choose');
}
function scannerKey(e){ if (e.key === 'Escape') closeScanner(); }
function closeScanner(){ if (SC.stream){ SC.stream.getTracks().forEach(t => t.stop()); SC.stream = null; } const b = document.getElementById('scanbox'); if (b) b.remove(); document.removeEventListener('keydown', scannerKey); }
function scanStep(step, msg){
  const el = document.getElementById('scBody'); if (!el) return;
  if (SC.stream && step !== 'camera'){ SC.stream.getTracks().forEach(t => t.stop()); SC.stream = null; }
  if (step === 'choose'){
    el.innerHTML = (msg ? '<p class="formerr" role="alert">'+esc(msg)+'</p>' : '')+
      '<p style="margin:0;color:var(--ink2)">Lay the check face up. The portal finds the check, straightens it, trims the background and shrinks it before saving.</p>'+
      '<div class="scan-choices"><button type="button" class="btn primary" onclick="scanCamera()">'+ic('upload')+'Use camera</button>'+
      '<label class="btn"><input id="scFile" type="file" accept="image/*,application/pdf" style="position:absolute;left:-9999px" onchange="scanFile(this.files[0])">'+ic('doc')+'Choose a scanned file</label></div>'+
      '<p class="hint" style="margin:0">Desk scanner: scan the check to a file (JPG, PNG or PDF) with the scanner\'s own app, then choose that file. Webcam or phone: hold the check flat on a dark, plain surface.</p>'+
      '<div class="row" style="justify-content:flex-end"><button type="button" class="btn ghost" onclick="closeScanner()">Cancel</button></div>';
    el.querySelector('button').focus();
  } else if (step === 'camera'){
    el.innerHTML = '<video id="scVid" autoplay playsinline muted style="width:100%;border-radius:8px;background:#000;max-height:60vh"></video>'+
      '<div class="row" style="gap:8px;justify-content:space-between"><button type="button" class="btn ghost" onclick="scanStep(\'choose\')">Back</button><button type="button" class="btn primary" id="scSnap" onclick="scanSnap()">Take picture</button></div>';
    const v = document.getElementById('scVid'); v.srcObject = SC.stream; document.getElementById('scSnap').focus();
  } else if (step === 'working'){
    el.innerHTML = '<p class="empty">Straightening and cropping…</p>';
  } else if (step === 'preview'){
    const url = SC.out.toDataURL('image/jpeg', 0.8);
    el.innerHTML = '<img class="scan-big" src="'+url+'" alt="Preview of the scanned check">'+
      (!SC.found && SC.auto ? '<p class="hint" style="margin:0">The check\'s edges were not clear, so the whole picture is kept. Rotate it if needed.</p>' : '')+
      '<div class="row" style="gap:8px;flex-wrap:wrap"><button type="button" class="btn sm" onclick="scanRotate(-90)" aria-label="Rotate left">↺ Rotate left</button><button type="button" class="btn sm" onclick="scanRotate(90)" aria-label="Rotate right">↻ Rotate right</button>'+
      '<button type="button" class="btn sm ghost" onclick="SC.auto=!SC.auto;scanRender()">'+(SC.auto ? 'Undo auto-crop' : 'Auto-crop again')+'</button></div>'+
      '<div class="row" style="gap:8px;justify-content:space-between;flex-wrap:wrap"><button type="button" class="btn ghost" onclick="scanStep(\'choose\')">Scan again</button><button type="button" class="btn primary" id="scUse" onclick="scanUse()">'+ic('check')+'Use this scan</button></div>';
    document.getElementById('scUse').focus();
  }
}
async function scanCamera(){
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){ scanStep('choose', 'This browser cannot use a camera here. Choose a scanned file instead.'); return; }
  try{ SC.stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment', width: { ideal: 1920 }, height: { ideal: 1080 } }, audio: false }); scanStep('camera'); }
  catch(e){ scanStep('choose', 'The camera could not be opened ('+(e.name==='NotAllowedError'?'permission was not given':e.name==='NotFoundError'?'no camera found':e.message)+'). Choose a scanned file instead.'); }
}
function scanSnap(){
  const v = document.getElementById('scVid'); if (!v || !v.videoWidth) return;
  const c = document.createElement('canvas'); c.width = v.videoWidth; c.height = v.videoHeight; c.getContext('2d').drawImage(v, 0, 0);
  scanProcess(c);
}
async function scanFile(file){
  if (!file) return;
  scanStep('working');
  try{
    let c;
    if (/pdf/i.test(file.type) || /\.pdf$/i.test(file.name)){
      const lib = await loadPdfJs(), doc = await lib.getDocument({ data: new Uint8Array(await file.arrayBuffer()) }).promise, pg = await doc.getPage(1);
      const vp0 = pg.getViewport({ scale: 1 }), vp = pg.getViewport({ scale: Math.min(3, 2400 / Math.max(vp0.width, vp0.height)) });
      c = document.createElement('canvas'); c.width = Math.round(vp.width); c.height = Math.round(vp.height);
      const g = c.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, c.width, c.height);
      await pg.render({ canvasContext: g, viewport: vp }).promise;
    } else {
      let bmp; try{ bmp = await createImageBitmap(file, { imageOrientation: 'from-image' }); }
      catch(e){ bmp = await new Promise((ok, no) => { const im = new Image(), u = URL.createObjectURL(file); im.onload = () => { URL.revokeObjectURL(u); ok(im); }; im.onerror = () => no(new Error('That file is not a picture the browser can open.')); im.src = u; }); }
      const w = bmp.width, h = bmp.height, k = Math.min(1, 3200 / Math.max(w, h));
      c = document.createElement('canvas'); c.width = Math.round(w * k); c.height = Math.round(h * k); c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height);
    }
    scanProcess(c);
  }catch(e){ scanStep('choose', 'Could not read that file: '+e.message); }
}
function scanProcess(c){
  scanStep('working');
  setTimeout(() => { SC.src = c; SC.rot = 0; SC.auto = true; const r = autoCropCheck(c); SC.crop = r.canvas; SC.found = r.found; scanRender(); }, 20);
}
function scanRender(){
  const base = SC.auto ? SC.crop : landscape_(SC.src);
  SC.out = fitScan_(rotateCanvas_(base, SC.rot));
  scanStep('preview');
}
function scanRotate(d){ SC.rot = (SC.rot + d + 360) % 360; scanRender(); }
async function scanUse(){
  let q = 0.72, url = SC.out.toDataURL('image/jpeg', q);
  while (url.length > 1300000 && q > 0.35){ q -= 0.1; url = SC.out.toDataURL('image/jpeg', q); }
  const scan = { url, mime:'image/jpeg', data: url.split(',')[1], width: SC.out.width, height: SC.out.height };
  const t = SC.target; closeScanner();
  if (t && t.kind === 'form'){ S.ck.scan = scan; render(); return; }
  if (t && t.kind === 'payment') await uploadScan(t.pid, scan);
}
async function uploadScan(pid, scan){
  try{
    const pj = await sbRpc('bf_add_check_scan', {p_token:TOKEN, p_payment_id:pid, p_mime:scan.mime, p_data:scan.data, p_width:scan.width, p_height:scan.height});
    SCANS[pid] = { data: scan.data, mime: scan.mime, addedBy: (S.me && S.me.name) || '', addedAt: new Date().toISOString(), width: scan.width, height: scan.height, earlier: 0 };
    const r = S.ck.rec; if (r && r.payments) r.payments = r.payments.map(p => p.id === pid ? Object.assign({}, p, pj) : p);
    if (S.ck.done && S.ck.done.id === pid) S.ck.done = Object.assign({}, S.ck.done, pj);
    if (r) delete PH[r.id];
    toast('Check scan saved'); render(); return true;
  }catch(e){ toast('The scan was not saved: '+e.message); render(); return false; }
}

/* image helpers */
function landscape_(c){ return c.height > c.width * 1.05 ? rotateCanvas_(c, 90) : c; }
function rotateCanvas_(c, deg){
  if (!deg) return c;
  const o = document.createElement('canvas'), q = deg % 180 !== 0;
  o.width = q ? c.height : c.width; o.height = q ? c.width : c.height;

/* Find the check against the background (scanner lid, desk), then cut it out straight.

function autoCropCheck(src){
  const W0 = src.width, H0 = src.height, k = Math.min(1, 640 / Math.max(W0, H0));
  const w = Math.max(8, Math.round(W0 * k)), h = Math.max(8, Math.round(H0 * k));
  const sm = document.createElement('canvas'); sm.width = w; sm.height = h; const sg = sm.getContext('2d'); sg.drawImage(src, 0, 0, w, h);
  const d = sg.getImageData(0, 0, w, h).data;
  // background = median colour of a 3px frame
  const fr = [[], [], []];
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++){ if (x > 2 && x < w-3 && y > 2 && y < h-3) continue; const i = (y*w + x)*4; fr[0].push(d[i]); fr[1].push(d[i+1]); fr[2].push(d[i+2]); }
  const med = a => { a.sort((p, q) => p - q); return a[a.length >> 1]; };
  const bg = fr.map(med);
  let noise = 0, nn = 0;
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++){ if (x > 2 && x < w-3 && y > 2 && y < h-3) continue; const i = (y*w + x)*4; noise += Math.abs(d[i]-bg[0]) + Math.abs(d[i+1]-bg[1]) + Math.abs(d[i+2]-bg[2]); nn++; }
  noise /= Math.max(1, nn);
  const T = Math.max(30, noise * 3 + 14);
  const lum = new Float32Array(w*h);
  for (let p = 0; p < w*h; p++) lum[p] = d[p*4]*0.299 + d[p*4+1]*0.587 + d[p*4+2]*0.114;
  let m = new Uint8Array(w*h);
  for (let y = 1; y < h-1; y++) for (let x = 1; x < w-1; x++){
    const p = y*w + x, i = p*4;
    const diff = Math.abs(d[i]-bg[0]) + Math.abs(d[i+1]-bg[1]) + Math.abs(d[i+2]-bg[2]);
    const gx = lum[p+1] - lum[p-1], gy = lum[p+w] - lum[p-w];
    if (diff > T || gx*gx + gy*gy > 900) m[p] = 1;
  }
  // close small gaps: dilate then erode (3x3, twice)
  const morph = (a, grow) => { const o = new Uint8Array(w*h); for (let y = 1; y < h-1; y++) for (let x = 1; x < w-1; x++){ const p = y*w + x; let s = 0;
      for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) s += a[p + dy*w + dx]; o[p] = grow ? (s > 0 ? 1 : 0) : (s === 9 ? 1 : 0); } return o; };
  m = morph(morph(m, true), true); m = morph(morph(m, false), false);
  // largest connected region
  const lab = new Int32Array(w*h); let best = 0, bestN = 0, cur = 0; const st = [];
  for (let p0 = 0; p0 < w*h; p0++){
    if (!m[p0] || lab[p0]) continue; cur++; let n = 0; st.push(p0); lab[p0] = cur;
    while (st.length){ const p = st.pop(); n++; const x = p % w, y = (p / w) | 0;
      if (x > 0 && m[p-1] && !lab[p-1]){ lab[p-1] = cur; st.push(p-1); } if (x < w-1 && m[p+1] && !lab[p+1]){ lab[p+1] = cur; st.push(p+1); }
      if (y > 0 && m[p-w] && !lab[p-w]){ lab[p-w] = cur; st.push(p-w); } if (y < h-1 && m[p+w] && !lab[p+w]){ lab[p+w] = cur; st.push(p+w); } }
    if (n > bestN){ bestN = n; best = cur; }
  }
  const fallback = () => ({ canvas: landscape_(src), found: false });
  if (!best || bestN < w*h*0.06) return fallback();
  // outline points (row extremes + column extremes) -> convex hull
  const pts = [];
  for (let y = 0; y < h; y++){ let a = -1, b = -1; for (let x = 0; x < w; x++) if (lab[y*w + x] === best){ if (a < 0) a = x; b = x; } if (a >= 0){ pts.push([a, y], [b + 1, y], [a, y + 1], [b + 1, y + 1]); } }
  pts.sort((p, q) => p[0] - q[0] || p[1] - q[1]);
  const cross = (o, a, b) => (a[0]-o[0])*(b[1]-o[1]) - (a[1]-o[1])*(b[0]-o[0]);
  const lower = [], upper = [];
  for (const p of pts){ while (lower.length >= 2 && cross(lower[lower.length-2], lower[lower.length-1], p) <= 0) lower.pop(); lower.push(p); }
  for (let i = pts.length - 1; i >= 0; i--){ const p = pts[i]; while (upper.length >= 2 && cross(upper[upper.length-2], upper[upper.length-1], p) <= 0) upper.pop(); upper.push(p); }
  const hull = lower.slice(0, -1).concat(upper.slice(0, -1));
  if (hull.length < 3) return fallback();
  // minimum-area rectangle around the hull (rotating calipers)
  let bestA = Infinity, R = null;
  for (let i = 0; i < hull.length; i++){
    const a = hull[i], b = hull[(i + 1) % hull.length], L = Math.hypot(b[0]-a[0], b[1]-a[1]); if (L < 1e-6) continue;
    const ux = (b[0]-a[0]) / L, uy = (b[1]-a[1]) / L, vx = -uy, vy = ux;
    let u0 = Infinity, u1 = -Infinity, v0 = Infinity, v1 = -Infinity;
    for (const p of hull){ const pu = p[0]*ux + p[1]*uy, pv = p[0]*vx + p[1]*vy; if (pu < u0) u0 = pu; if (pu > u1) u1 = pu; if (pv < v0) v0 = pv; if (pv > v1) v1 = pv; }
    const A = (u1 - u0) * (v1 - v0); if (A < bestA){ bestA = A; R = { ux, uy, u0, u1, v0, v1 }; }
  }
  const rw = R.u1 - R.u0, rh = R.v1 - R.v0;
  if (rw * rh > w*h*0.97) return fallback();
  // long side horizontal, smallest turn
  let lx = rw >= rh ? R.ux : -R.uy, ly = rw >= rh ? R.uy : R.ux;
  if (lx < 0 || (lx === 0 && ly < 0)){ lx = -lx; ly = -ly; }
  const px = -ly, py = lx;
  let a0 = Infinity, a1 = -Infinity, b0 = Infinity, b1 = -Infinity;
  for (const p of hull){ const pu = p[0]*lx + p[1]*ly, pv = p[0]*px + p[1]*py; if (pu < a0) a0 = pu; if (pu > a1) a1 = pu; if (pv < b0) b0 = pv; if (pv > b1) b1 = pv; }
  const pad = 0.003 * Math.max(a1 - a0, b1 - b0); a0 -= pad; a1 += pad; b0 -= pad; b1 += pad;
  const s = 1 / k, OW = Math.round((a1 - a0) * s), OH = Math.round((b1 - b0) * s);
  const out = document.createElement('canvas'); out.width = Math.max(1, OW); out.height = Math.max(1, OH);
  const g = out.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, out.width, out.height);
  const ox = (a0*lx + b0*px) * s, oy = (a0*ly + b0*py) * s;          // rectangle corner in source pixels
  g.setTransform(lx, px, ly, py, -(lx*ox + ly*oy), -(px*ox + py*oy));
  g.drawImage(src, 0, 0);
  g.setTransform(1, 0, 0, 1, 0, 0);
  return { canvas: out, found: true, angle: Math.atan2(ly, lx) * 180 / Math.PI };
}

      const score = (a && xa === a ? 3 : 0) + (num && xa.startsWith(num+' ') ? 1 : 0) + (x.fields.owner && s.fields.owner && x.fields.owner.toLowerCase() === s.fields.owner.toLowerCase() ? 1 : 0);

const MONTH_NAMES = ['January','February','March','April','May','June','July','August','September','October','November','December'];
const monthLabel = ym => { const [y, m] = String(ym).split('-'); return MONTH_NAMES[(+m||1)-1]+' '+y; };
const cictAmt = s => Math.round((Number(s.fees && s.fees.cict) || 0) * 100) / 100;
function cictDate(s, basis){
  if (basis === 'submitted') return { ym:(s.createdAt||'').slice(0,7), day:(s.createdAt||'').slice(0,10), est:false };
  if (payStatus(s) !== 'paid') return null;
  const d = s.pay && s.pay.lastPaidOn;
  return d ? { ym:String(d).slice(0,7), day:String(d).slice(0,10), est:false } : { ym:(s.createdAt||'').slice(0,7), day:(s.createdAt||'').slice(0,10), est:true };
}
function cictData(basis){
  const rows = [];
  S.subs.forEach(s => { const c = cictAmt(s); if (!(c > 0)) return; const d = cictDate(s, basis); if (!d || !d.ym) return; rows.push({ s, c, d }); });
  const months = {}; rows.forEach(r => { const m = months[r.d.ym] || (months[r.d.ym] = { ym:r.d.ym, n:0, total:0, value:0 }); m.n++; m.total += r.c; m.value += Number(r.s.fees.value)||0; });
  return { rows, months: Object.values(months).sort((a,b) => b.ym.localeCompare(a.ym)) };
}
function cictState(){
  const C = S.cict || (S.cict = Object.assign({}, PREF_DEFAULTS.cict, prefGet('cict')));
  const D = cictData(C.basis), now = new Date(), cur = now.getFullYear()+'-'+String(now.getMonth()+1).padStart(2,'0');
  const opts = [...new Set([cur].concat(D.months.map(m => m.ym)))].sort().reverse();
  if (!C.ym || !opts.includes(C.ym)) C.ym = D.months.length ? D.months[0].ym : cur;
  const list = D.rows.filter(r => r.d.ym === C.ym).sort((a,b) => a.d.day.localeCompare(b.d.day));
  return { C, D, opts, list, total: Math.round(list.reduce((a,r) => a + r.c, 0)*100)/100, value: list.reduce((a,r) => a + (Number(r.s.fees.value)||0), 0) };
}

function cictCsv(){

/* ---- CSV + ZIP (no extra libraries) ---- */
function csvCell(v){
  if (v == null) v = ''; else if (typeof v === 'object') v = JSON.stringify(v);
  v = String(v).replace(/\r\n?/g, '\n');
  if (/^[=+@\t]/.test(v) || (/^-/.test(v) && !/^-\d/.test(v))) v = "'" + v;      // stop spreadsheet formulas
  return /[",\n]/.test(v) || v !== v.trim() ? '"' + v.replace(/"/g, '""') + '"' : v;
}
const csvText = (head, rows) => '﻿' + [head].concat(rows).map(r => r.map(csvCell).join(',')).join('\r\n') + '\r\n';
const CRC_T = (() => { const t = new Uint32Array(256); for (let n = 0; n < 256; n++){ let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; } return t; })();
const crc32 = b => { let c = 0xFFFFFFFF; for (let i = 0; i < b.length; i++) c = CRC_T[(c ^ b[i]) & 0xFF] ^ (c >>> 8); return (c ^ 0xFFFFFFFF) >>> 0; };
function zipFiles(files){   // [{name, data:string|Uint8Array}] -> Blob (stored, UTF-8 names)
  const enc = new TextEncoder(), parts = [], cen = []; let off = 0;
  const d = new Date(), dt = ((d.getFullYear()-1980) << 9) | ((d.getMonth()+1) << 5) | d.getDate(), tm = (d.getHours() << 11) | (d.getMinutes() << 5) | (d.getSeconds() >> 1);
  files.forEach(f => {
    const name = enc.encode(f.name), data = typeof f.data === 'string' ? enc.encode(f.data) : f.data, crc = crc32(data);
    const h = new DataView(new ArrayBuffer(30));
    h.setUint32(0, 0x04034b50, true); h.setUint16(4, 20, true); h.setUint16(6, 0x0800, true); h.setUint16(8, 0, true);
    h.setUint16(10, tm, true); h.setUint16(12, dt, true); h.setUint32(14, crc, true); h.setUint32(18, data.length, true); h.setUint32(22, data.length, true);
    h.setUint16(26, name.length, true); h.setUint16(28, 0, true);
    parts.push(new Uint8Array(h.buffer), name, data);
    const c = new DataView(new ArrayBuffer(46));
    c.setUint32(0, 0x02014b50, true); c.setUint16(4, 20, true); c.setUint16(6, 20, true); c.setUint16(8, 0x0800, true); c.setUint16(10, 0, true);
    c.setUint16(12, tm, true); c.setUint16(14, dt, true); c.setUint32(16, crc, true); c.setUint32(20, data.length, true); c.setUint32(24, data.length, true);
    c.setUint16(28, name.length, true); c.setUint32(42, off, true);
    cen.push(new Uint8Array(c.buffer), name); off += 30 + name.length + data.length;
  });
  const cenLen = cen.reduce((a, x) => a + x.length, 0), e = new DataView(new ArrayBuffer(22));
  e.setUint32(0, 0x06054b50, true); e.setUint16(8, files.length, true); e.setUint16(10, files.length, true); e.setUint32(12, cenLen, true); e.setUint32(16, off, true);
  return new Blob(parts.concat(cen, [new Uint8Array(e.buffer)]), {type:'application/zip'});
}

  const seen = {}; const lab = x => { let l = x.label.length > 90 ? x.label.slice(0, 90)+'…' : x.label; if (seen[l]) l += ' ('+x.id+')'; seen[l] = 1; return l; };

  const rows = recs.map(r => { const d = r.data || {}, f = d.fields || {}, st = d.staff || {}, fe = d.fees || {}, p = d.pay || {}, ins = st.inspections || {};

      .concat(defs.map(x => f[x.id])).concat(extra.map(x => f[x])); });
  return csvText(head, rows);
}

function csvGeneric(rows, filename){
  const head = ['Form','Submission Date','Permit #','Applicant','Email','Phone','Address','Lot #','Construction Value','Permit Fee','CICT Fee','Grand Total','Payment','Check #','C of O','Documents'];

  DL.save({ filename, data: lines.join('\r\n') });
}

// ---- passwords: 12+ characters, not a common one, not the email name ----
const COMMON_PW = ['password','passw0rd','123456','12345678','123456789','1234567890','qwerty','qwertyuiop','iloveyou','welcome','letmein','changeme',
  'admin','administrator','abc123','111111','monkey','dragon','football','baseball','sunshine','princess','trustno1','1q2w3e4r','arabcity','cityofarab','building','buildingdept','alabama'];
function pwProblem(p, email){
  p = String(p||'');
  if (p.length < 12) return 'Use at least 12 characters. A short phrase of three or four words is easy to remember.';
  const l = p.toLowerCase().replace(/[^a-z0-9]/g,'');
  const rest = w => l.split(w).join('');
  if (/^(.)\1+$/.test(p) || COMMON_PW.some(w => l.includes(w) && (rest(w).length < 6 || /^\d+$/.test(rest(w))))) return 'That password is too easy to guess. Choose something less common.';
  const u = String(email||'').split('@')[0].toLowerCase().replace(/[^a-z0-9]/g,'');
  if (u.length >= 4 && l.includes(u)) return 'Do not use your email name in your password.';
  return '';
}

const IDLE_MIN = 30; let IDLE_AT = Date.now();

/* ================= copy documents of imported applications into the portal (records permission) ================= */
async function readZip(buf){
  const dv = new DataView(buf), u8 = new Uint8Array(buf), td = new TextDecoder();
  let e = -1; for (let i = buf.byteLength - 22; i >= Math.max(0, buf.byteLength - 70000); i--) if (dv.getUint32(i, true) === 0x06054b50){ e = i; break; }
  if (e < 0) throw new Error('That file is not a ZIP file.');
  let p = dv.getUint32(e + 16, true); const n = dv.getUint16(e + 10, true), out = [];
  for (let k = 0; k < n; k++){
    if (dv.getUint32(p, true) !== 0x02014b50) break;
    const method = dv.getUint16(p + 10, true), comp = dv.getUint32(p + 20, true), nl = dv.getUint16(p + 28, true), xl = dv.getUint16(p + 30, true), cl = dv.getUint16(p + 32, true), lo = dv.getUint32(p + 42, true);
    const name = td.decode(u8.subarray(p + 46, p + 46 + nl));
    if (!name.endsWith('/') && !/(^|\/)(__MACOSX|\.DS_Store)/.test(name)){
      const start = lo + 30 + dv.getUint16(lo + 26, true) + dv.getUint16(lo + 28, true);
      out.push({ name, base: name.split('/').pop(), method, data: u8.subarray(start, start + comp) });
    }
    p += 46 + nl + xl + cl;
  }
  return out;
}
async function unzipEntry(en){
  if (en.method === 0) return en.data.slice();
  if (en.method !== 8) throw new Error('Unsupported compression');
  return new Uint8Array(await new Response(new Blob([en.data]).stream().pipeThrough(new DecompressionStream('deflate-raw'))).arrayBuffer());
}
const normName = s => String(s||'').toLowerCase().replace(/\s+/g,' ').trim();
function jfUrlParts(url){ const m = String(url).match(/\/uploads\/[^/]+\/(\d+)\/(\d+)\/([^/?#]+)/); if (!m) return null; let f = m[3]; try{ f = decodeURIComponent(f); }catch(e){} return { form:m[1], sub:m[2], file:f }; }
function matchZip(entries){
  const byBase = {}; entries.forEach(en => { const k = normName(en.base); (byBase[k] = byBase[k] || []).push(en); });
  const plan = [], missing = [];
  S.subs.filter(s => (s.files||[]).some(f => f.url)).forEach(s => {
    s.files.forEach((f, i) => { if (!f.url) return;
      const pp = jfUrlParts(f.url), cands = byBase[normName(pp ? pp.file : f.name)] || [];
      const en = (pp && cands.find(c => c.name.includes(pp.sub))) || (cands.length === 1 ? cands[0] : null);
      if (en) plan.push({ s, i, f, en }); else missing.push({ s, f });
    });
  });
  return { plan, missing };
}
function zipCardHtml(){

    (waiting ? '<div class="fld"><label class="l" for="zipFile">Attachments ZIP</label><input id="zipFile" type="file" accept=".zip,application/zip" onchange="readJfZip(this.files[0])"><span class="hint">'+(Z.file?esc(Z.file):'You can upload ZIPs from several forms, one at a time.')+'</span></div>' : '')+
    (Z.err?'<p class="formerr">'+esc(Z.err)+'</p>':'')+

      (Z.plan.length ? '<div class="row"><button class="btn primary" id="zipGo" onclick="runZipAttach()">'+ic('upload')+'Copy '+Z.plan.length+' document'+(Z.plan.length===1?'':'s')+' here</button></div>' : '') : '')+
    (Z.done ? '<div class="creds" role="status"><b>'+esc(Z.done)+'</b></div>' : '')+
  '</div>';

async function readJfZip(file){
  if (!file) return; S.zip = { file:file.name };
  try{
    if (typeof DecompressionStream === 'undefined') throw new Error('This browser cannot open ZIP files. Use a current version of Chrome, Edge or Safari.');
    const entries = await readZip(await file.arrayBuffer());
    const m = matchZip(entries);
    S.zip.big = m.plan.filter(x => x.en.data.length > MAX_FILE_MB*1048576*1.2).length;   // compressed size check; real size checked again below
    S.zip.plan = m.plan; S.zip.missing = m.missing;
    if (!entries.length) S.zip.err = 'That ZIP file is empty.';
  }catch(e){ S.zip.err = e.message; }
  render();
}
async function runZipAttach(){
  const Z = S.zip, b = document.getElementById('zipGo'); let done = 0, skipped = 0;
  const bySub = new Map(); Z.plan.forEach(x => { if (!bySub.has(x.s.id)) bySub.set(x.s.id, []); bySub.get(x.s.id).push(x); });
  try{
    for (const [sid, items] of bySub){
      const s = S.subs.find(x => x.id === sid); if (!s) continue;
      const files = s.files.map(f => Object.assign({}, f));
      for (const x of items){
        if (b){ b.disabled = true; b.textContent = 'Copying '+(done+skipped+1)+' of '+Z.plan.length+'…'; }
        const bytes = await unzipEntry(x.en);
        if (bytes.length > MAX_FILE_MB*1048576){ skipped++; continue; }
        const ext = (x.en.base.split('.').pop()||'').toLowerCase();
        const type = ext==='pdf' ? 'application/pdf' : ext==='png' ? 'image/png' : /^(jpe?g)$/.test(ext) ? 'image/jpeg' : (x.f.type || 'application/octet-stream');
        const data = await readDataUrl(new Blob([bytes], {type}));
        await sbRpc('bf_add', { p_token:TOKEN, p_collection:'attachments', p_data:{ app:APP_TAG, submissionId:sid, index:x.i, name:x.f.name, type, size:bytes.length, data, fromImport:true } });
        files[x.i] = { name:x.f.name, type, size:bytes.length, copiedFromImport:true };
        done++;
      }
      await sbRpc('bf_update', { p_token:TOKEN, p_collection:'submissions', p_id:sid, p_patch:{ files } });
      s.files = files; delete ATT[sid];
    }
    S.zip = { done: 'Copied '+done+' document'+(done===1?'':'s')+' into this system'+(skipped?'; '+skipped+' over 8 MB stayed in the previous system':'')+'. They now open from the Documents tab and print in the PDF.' };
  }catch(e){ S.zip.err = 'Stopped after '+done+': '+e.message; }
  await loadStorage(); render();
}
